  .linkbtn { background:none; border:0; color:var(--router); font:inherit; padding:0; cursor:pointer; text-align:left; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#5b6b84; margin-right:6px; } .dot.up { background:var(--host); }
  .lab { position:absolute; left:0; top:0; background:rgba(10,18,32,.86); border:1px solid var(--line); border-left:3px solid var(--c); border-radius:5px; color:var(--ink);

function parse(seg) { const pts = []; let x, y; seg.match(/[MHV][^MHV]+/g).forEach(t => { const k = t[0], n = t.slice(1).trim().split(/\s+/).map(Number); if (k === 'M') { x = n[0]; y = n[1]; } if (k === 'H') x = n[0]; if (k === 'V') y = n[0]; pts.push(new THREE.Vector3(px(x), .05, pz(y))); }); return pts; }
function poly(pts) { const c = new THREE.CurvePath(); for (let i = 1; i < pts.length; i++) c.add(new THREE.LineCurve3(pts[i - 1], pts[i])); return c; }
const pulses = [], linkMeshes = [], stretched = [];
LINKS.forEach((l, i) => {
  const mat = new THREE.MeshStandardMaterial({ color:COL[l.type], emissive:COL[l.type], emissiveIntensity:.35, roughness:.5, transparent:true });
  linkMeshes[i] = { mat, l };
  Object.entries(l.segs).forEach(([floor, seg]) => {
    const curve = poly(parse(seg));
    const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, l.type === 'virt' ? .025 : .042, 6), mat); floorGroups[floor].add(m);
    const pm = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 6), new THREE.MeshBasicMaterial({ color:COL[l.type], transparent:true })); floorGroups[floor].add(pm);
    pulses.push({ pm, curve, t:Math.random(), s:.18 + Math.random() * .1, link:i });
  });
  if (l.riser) {
    const [sx, a, b] = l.riser; const m = new THREE.Mesh(new THREE.CylinderGeometry(.042, .042, 1, 6), mat); scene.add(m);
    stretched.push({ m, x:px(sx), z:pz(28), a, b });
  }
});
/* Cable climbs the wardrobe front to the router on top */
{ const mat = linkMeshes[LINKS.findIndex(l => l.b === 'exc')].mat, m = new THREE.Mesh(new THREE.CylinderGeometry(.042, .042, 2.2, 6), mat); m.position.set(px(350), 1.15, pz(118)); floorGroups.first.add(m);
  const t = new THREE.Mesh(new THREE.CylinderGeometry(.042, .042, pz(134) - pz(118), 6), mat); t.rotation.x = Math.PI / 2; t.position.set(px(350), 2.2, (pz(118) + pz(134)) / 2); floorGroups.first.add(t); }
/* Wi-Fi link to the PC, drawn as an arc of dots */
{ const i = LINKS.findIndex(l => l.type === 'wifi'); const a = DEVICES.ap, b = DEVICES.cb;
  const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(px(a.x), 1, pz(a.y)), new THREE.Vector3((px(a.x) + px(b.x)) / 2, 2.6, pz(a.y) - .3), new THREE.Vector3(px(b.x), 1.2, pz(b.y)));
  const mat = new THREE.MeshBasicMaterial({ color:COL.wifi, transparent:true }); linkMeshes[i] = { mat, l:LINKS[i] };
  for (let k = 1; k < 15; k++) { const s = new THREE.Mesh(new THREE.SphereGeometry(.03, 6, 5), mat); s.position.copy(curve.getPoint(k / 15)); floorGroups.second.add(s); }
}
/* Fibre drop from the street pole into the top floor */
const drop = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, 1, 6), M.dark); scene.add(drop);
/* Wi-Fi coverage: expanding rings. Illustrative, not a signal measurement */
const waves = [];
[['up'], ['ap']].forEach(([id]) => { for (let k = 0; k < 3; k++) { const m = new THREE.Mesh(new THREE.RingGeometry(.97, 1, 64), new THREE.MeshBasicMaterial({ color:COL.wifi, transparent:true, side:THREE.DoubleSide, depthWrite:false })); m.rotation.x = -Math.PI / 2; m.position.y = .9; devObjs[id].g.add(m); waves.push({ m, t:k / 3 }); } });

/* ---------- State ---------- */
let mode = 'outside', floorSel = 'all', selected = null, spread = 0, tween = null;
const $ = id => document.getElementById(id);
const floorY = (id, s = spread) => (id === 'roof' ? 4 : LEVEL[id]) * (FH + s * GAP);
function flyTo(pos, tgt) { tween = { p:new THREE.Vector3(...pos), t:new THREE.Vector3(...tgt), k:0 }; }
controls.addEventListener('start', () => { tween = null; });
function view() {
  if (mode === 'outside') return flyTo([20, 8, 27], [0, 6.4, 0]);
  if (floorSel === 'all') return flyTo([31, 28, 47], [0, 17, 0]);
  const y = floorY(floorSel, 1); flyTo([9, y + 9, 15], [0, y + .8, 0]);
}
function setMode(m) { mode = m; if (m === 'outside') { floorSel = 'all'; select(null, true); } sync(); view(); }
function setFloor(f) { floorSel = f; if (f !== 'all') mode = 'inside'; sync(); view(); }
function sync() {
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === mode));
  document.querySelectorAll('#floorSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === floorSel));
  const lim = floorSel === 'all' ? 9 : LEVEL[floorSel];
  FLOORS.forEach(f => { floorGroups[f.id].visible = LEVEL[f.id] <= lim; });
  floorGroups.roof.visible = floorSel === 'all';
}
function select(id, quiet) {
  selected = id;
  Object.entries(devObjs).forEach(([k, o]) => { o.r.visible = k === id; o.lab.classList.toggle('sel', k === id); const near = !id || k === id || LINKS.some(l => (l.a === id && l.b === k) || (l.b === id && l.a === k)); o.lab.classList.toggle('dim', !near); });
  linkMeshes.forEach(({ mat, l }) => { const on = !id || l.a === id || l.b === id; mat.opacity = on ? 1 : .12; });
  pulses.forEach(p => { const l = LINKS[p.link]; p.pm.visible = !id || l.a === id || l.b === id; });
  render();
  if (id && !quiet) { mode = 'inside'; floorSel = DEVICES[id].floor; sync(); const d = DEVICES[id], y = floorY(d.floor, 1); flyTo([px(d.x) * .4 + 6, y + 6, pz(d.y) + 9], [px(d.x) * .7, y + .8, pz(d.y) * .6]); if (matchMedia('(max-width:820px)').matches) $('panel').scrollIntoView({ behavior:'smooth', block:'start' }); }
}
[['outside', 'Outside'], ['inside', 'See inside']].forEach(([v, n]) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.v = v; b.textContent = n; b.onclick = () => { setMode(v); }; $('modeSeg').appendChild(b); });
[['all', 'All floors'], ['top', 'Top'], ['second', 'Second'], ['first', 'First'], ['ground', 'Ground']].forEach(([v, n]) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.v = v; b.textContent = n; b.onclick = () => { select(null, true); setFloor(v); }; $('floorSeg').appendChild(b); });

/* Transparent walls: ghost every wall, and stop hiding the ones facing the camera */
let seeThrough = false;
function setWalls(on) {
  seeThrough = on;
  [M.wall, M.inner].forEach(m => { m.transparent = on; m.opacity = on ? .2 : 1; m.depthWrite = !on; m.needsUpdate = true; });
  scene.traverse(o => { if (o.isMesh && (o.material === M.wall || o.material === M.inner)) o.castShadow = !on; });
  $('wallBtn').setAttribute('aria-pressed', on);
}
$('wallBtn').onclick = () => setWalls(!seeThrough);

/* ---------- Panel ---------- */
const status = {}; let checked = false;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function render() {
  const box = $('panel');
  if (!selected) {
    const svc = new Set(Object.values(DEVICES).flatMap(d => d.services.filter(s => /^https?:/.test(s[1] || '')).map(s => s[1])));
    const up = [...svc].filter(u => status[u]).length;
    const list = [...FLOORS].reverse().map(f => `<h4>${f.name}</h4><ul>${Object.entries(DEVICES).filter(([, d]) => d.floor === f.id).map(([k, d]) => `<li><button class="linkbtn" data-go="${k}">${esc(d.name)}</button>${d.ip ? ` <span class="sub">· ${esc(d.ip)}</span>` : ''}</li>`).join('')}</ul>`).join('');
    box.innerHTML = `<h3>The house at a glance</h3><p class="sub" style="margin:6px 0">Two internet lines feed the ER605: Airtel on the top floor and Excitel from the first floor. The ER605 feeds the AP on the second floor, which feeds the Syrotech router.</p>
      <dl class="kv"><dt>Web services answering</dt><dd>${location.protocol === 'https:' ? 'Only checked on a local copy' : checked ? up + ' of ' + svc.size : 'Checking…'}</dd><dt>Wi-Fi networks</dt><dd>Ashutosh, Ashutosh-Secured</dd><dt>Cable colours</dt><dd><span style="color:#6ea8fe">Blue</span> Ethernet, <span style="color:#4fd1c5">teal</span> NFS, <span style="color:#f2c063">amber</span> Wi-Fi, <span style="color:#c39bff">purple</span> virtual</dd></dl>${list}
      <p class="note">Select "See inside" to lift the floors apart, or pick a device to go to it. Drag to orbit, scroll to zoom.</p>
      <p class="note" style="margin-bottom:0">Devices and addresses come from local.internal (snapshot 5 Nov 2026), without logins. Rooms follow the hand-drawn plans. Size, exterior, exact device spots and cable routes are estimates. A grey dot means no reply to this browser, which doesn't prove a service is down.</p>`;
    return;
  }
  const d = DEVICES[selected], floor = FLOORS.find(f => f.id === d.floor).name;
  const conns = LINKS.filter(l => l.a === selected || l.b === selected).map(l => { const o = l.a === selected ? l.b : l.a; return `<li>${o === 'inet' ? 'Internet' : `<button class="linkbtn" data-go="${o}">${esc(DEVICES[o].name)}</button>`} <span class="sub">· ${esc(l.label)}</span></li>`; }).join('');
  const svcs = d.services.map(([n, u, note]) => { const t = note ? ` <span class="sub">· ${esc(note)}</span>` : ''; return u ? `<li>${/^https?:/.test(u) ? `<span class="dot${status[u] ? ' up' : ''}"></span>` : ''}<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>${t}</li>` : `<li>${esc(n)}${t}</li>`; }).join('');
  const facts = { ...(d.ip && !['pc', 'store'].includes(d.kind) ? { Address:d.ip } : {}), ...d.facts };
  box.innerHTML = `<h3>${esc(d.name)}</h3><div class="sub">${esc(d.role)} · ${floor}</div><h4>Details</h4><dl class="kv">${Object.entries(facts).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <h4>Connected to</h4><ul>${conns}</ul>${svcs ? `<h4>Services</h4><ul>${svcs}</ul>` : ''}<p style="margin:12px 0 0"><button class="linkbtn" data-go="">← Whole house</button></p>`;
}
$('panel').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (!b) return; if (b.dataset.go) select(b.dataset.go); else { select(null, true); floorSel = 'all'; sync(); view(); } });

/* Click on a device */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
el.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = el.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(hits.filter(m => devObjs[m.userData.id].g.parent.visible), false)[0];
  if (h && (seeThrough || mode === 'inside')) select(h.object.userData.id);
});

/* Layout and loop */
function size() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); const side = innerWidth > 820 ? 352 : 0; camera.aspect = w / h; camera.setViewOffset(w, h, side / 2, 0, w, h); camera.updateProjectionMatrix(); }
addEventListener('resize', size); size();
const clock = new THREE.Clock(), v = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), camDir = new THREE.Vector3();
const NORMALS = { front:[0, 1], back:[0, -1], left:[-1, 0], right:[1, 0] };
function stretch(m, a, b) { v.subVectors(b, a); m.position.copy(a).addScaledVector(v, .5); m.scale.set(1, v.length(), 1); m.quaternion.setFromUnitVectors(up, v.clone().normalize()); }
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .25), inside = mode === 'inside';
  spread += ((inside ? 1 : 0) - spread) * Math.min(1, dt * 3.5);
  if (Math.abs(spread - (inside ? 1 : 0)) < .001) spread = inside ? 1 : 0;
  FLOORS.forEach(f => { floorGroups[f.id].position.y = floorY(f.id); }); roof.position.y = floorY('roof');
  if (tween) { const a = 1 - Math.exp(-dt * 3.5); camera.position.lerp(tween.p, a); controls.target.lerp(tween.t, a); if (camera.position.distanceTo(tween.p) < .02) tween = null; }
  controls.update();
  camDir.subVectors(camera.position, controls.target).setY(0).normalize();
  Object.entries(sideGroups).forEach(([s, gs]) => { const [nx, nz] = NORMALS[s], hide = !seeThrough && spread > .02 && nx * camDir.x + nz * camDir.z > .2; gs.forEach(g => { g.visible = !hide; }); });
  partitions.forEach(g => { g.scale.y = seeThrough ? 1 : 1 - spread * .62; });
  stretched.forEach(s => { const lo = new THREE.Vector3(s.x, floorY(s.b) + .05, s.z), hi = new THREE.Vector3(s.x, floorY(s.a) + .05, s.z); stretch(s.m, lo, hi); s.m.visible = floorSel === 'all' ; });
  stretch(drop, new THREE.Vector3(-11, 9.4, 11.6), new THREE.Vector3(-6, floorY('top') + 2.4, pz(115)));
  drop.visible = floorSel === 'all' || floorSel === 'top';
  const time = clock.elapsedTime;
  pulses.forEach(p => { p.t = (p.t + dt * p.s) % 1; p.pm.position.copy(p.curve.getPointAt(p.t)); p.pm.position.y += .03; });
  leds.forEach((m, i) => { m.visible = Math.sin(time * 5 + i * 1.7) > -.65; });
  waves.forEach(w => { w.t = (w.t + dt * .18) % 1; const s = .5 + w.t * 6; w.m.scale.set(s, s, 1); w.m.material.opacity = inside ? (1 - w.t) * .55 : 0; w.m.visible = inside; });
  Object.values(devObjs).forEach(o => { o.r.rotation.z = time; o.g.traverse(c => { if (c.userData.spin) c.rotation.y = time * .5; }); });
  // labels
  const W = stage.clientWidth, H = stage.clientHeight, placed = [];
  Object.values(devObjs).forEach(o => {
    const show = (seeThrough || spread > .6) && o.g.parent.visible;
    o.lab.style.display = show ? 'block' : 'none'; if (!show) return;
    o.g.getWorldPosition(v); v.y += o.d.kind === 'server' || o.d.kind === 'virt' ? 1.75 : 1.3; v.project(camera);
    placed.push({ o, x:(v.x + 1) / 2 * W, y:(1 - v.y) / 2 * H, w:o.lab.offsetWidth, h:o.lab.offsetHeight });
  });
  // stack labels upward where they would overlap
  placed.sort((a, b) => b.y - a.y).forEach((p, i) => {
    for (let moved = true; moved;) { moved = false; for (let j = 0; j < i; j++) { const q = placed[j]; if (Math.abs(p.x - q.x) < (p.w + q.w) / 2 + 3 && Math.abs(p.y - q.y) < (p.h + q.h) / 2 + 2) { p.y = q.y - (p.h + q.h) / 2 - 3; moved = true; } } }
    p.o.lab.style.transform = `translate(-50%,-100%) translate(${p.x}px,${p.y}px)`;
  });
  renderer.render(scene, camera);
}

/* Live reachability: an opaque reply proves the server answered, nothing more */
async function probe(u) { try { await fetch(u, { mode:'no-cors', cache:'no-store', signal:AbortSignal.timeout(4000) }); return true; } catch { return false; } }
const urls = new Set(Object.values(DEVICES).flatMap(d => [d.probe, ...d.services.map(s => s[1])]).filter(u => /^https?:/.test(u || '')));
if (location.protocol !== 'https:') Promise.all([...urls].map(async u => { status[u] = await probe(u); })).then(() => { checked = true; render(); });

window.__home = { select, setMode, setFloor };
sync(); render(); frame();
</script>
