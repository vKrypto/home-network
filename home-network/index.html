  #panel iframe { display:block; width:100%; height:100%; border:0; }
  #panel { position:absolute; top:12px; right:12px; bottom:12px; width:328px; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  #panel h3 { margin:0; font-size:17px; }
  #panel h4 { margin:14px 0 4px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .sub,.note { color:var(--muted); } .note { font-size:12.5px; }
  .kv { margin:0; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; } .kv dt { color:var(--muted); } .kv dd { margin:0; overflow-wrap:anywhere; }
  ul { list-style:none; margin:0; padding:0; } li { padding:4px 0; border-top:1px solid #2a3c58; overflow-wrap:anywhere; } li:first-child { border-top:0; }
  .linkbtn { background:none; border:0; color:var(--router); font:inherit; padding:0; cursor:pointer; text-align:left; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#5b6b84; margin-right:6px; } .dot.up { background:var(--host); }
  .lab { position:absolute; left:0; top:0; background:rgba(10,18,32,.86); border:1px solid var(--line); border-left:3px solid var(--c); border-radius:5px; color:var(--ink);
         font:600 11.5px/1.25 system-ui,sans-serif; padding:3px 7px; cursor:pointer; white-space:nowrap; text-align:left; transition:opacity .15s; }

  .lab .ssid { display:flex; align-items:center; gap:4px; margin-top:2px; color:#f2c063; font-size:11px; }
  .lab.dim { opacity:.3; } .lab.sel { background:#24406a; }

/* ---------- Panel ---------- */
const status = {}; let checked = false;

function inventory() {
  const K = Object.values(DEVICES), n = f => K.filter(f).length, L = t => LINKS.filter(l => l.type === t).length;
  return [['Routers and gateway', n(d => d.kind === 'router')], ['Servers', n(d => d.kind === 'server' || d.kind === 'pi')], ['Storage', n(d => d.kind === 'store')], ['Virtual machines', n(d => d.kind === 'virt')], ['PCs and TV', n(d => d.kind === 'pc' || d.kind === 'tv')],
    ['PON fibres', L('pon')], ['Router-to-router cables', L('eth')], ['Device cables', L('lan')], ['Wi-Fi links', L('wifi')], ['Virtual links', L('virt')], ['Street pole', 1], ['Server rack (Rack view)', 1]]

}

    box.innerHTML = `<h3>The house at a glance</h3><p class="sub" style="margin:6px 0">PON fibres from the nearby pole feed the Airtel-Ashutosh and Excitel routers, which connect to the ER605 as redundant lines. It feeds the AP on the second floor, which feeds the routers below.</p>
      <dl class="kv"><dt>Web services answering</dt><dd>${location.protocol === 'https:' ? 'Only checked on a local copy' : checked ? up + ' of ' + svc.size : 'Checking…'}</dd><dt>Wi-Fi networks</dt><dd>${[...new Set(Object.values(DEVICES).filter(d => d.ssid).map(d => esc(d.ssid)))].join(', ')}</dd><dt>Cable colours</dt><dd><span style="color:#ff8a3d">Orange</span> PON fibre, <span style="color:#6ea8fe">blue</span> router to router (in ceiling and walls, on the floor on the top floor only), <span style="color:#3ecf8e">green</span> router to device, <span style="color:#f2c063">amber</span> Wi-Fi, <span style="color:#c39bff">purple</span> virtual</dd><dt>Routers</dt><dd>Front is input, back is output</dd></dl>
      <h4>Building</h4><dl class="kv"><dt>Footprint</dt><dd>24 ft wide x 40 ft deep</dd><dt>Floor heights</dt><dd>Ground 11 ft, others 10 ft</dd><dt>Office rooms</dt><dd>13 ft x 7 ft each</dd></dl><h4>Network objects</h4><dl class="kv">${inventory()}</dl>${list}

  }

  const svcs = d.services.map(([n, u, note]) => { const t = note ? ` <span class="sub">· ${esc(note)}</span>` : ''; return u ? `<li>${/^https?:/.test(u) ? `<span class="dot${status[u] ? ' up' : ''}"></span>` : ''}<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>${t}</li>` : `<li>${esc(n)}${t}</li>`; }).join('');
  const facts = { ...(d.ip && !['pc', 'store'].includes(d.kind) ? { Address:d.ip } : {}), ...d.facts, ...(CHANNEL[d.ssid] ? { 'Wi-Fi channel':CHANNEL[d.ssid] } : {}) };
  box.innerHTML = `<h3>${esc(d.name)}</h3><div class="sub">${esc(d.role)} · ${floor}</div><h4>Details</h4><dl class="kv">${Object.entries(facts).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <h4>Connected to</h4><ul>${conns}</ul>${svcs ? `<h4>Services</h4><ul>${svcs}</ul>` : ''}<p style="margin:12px 0 0"><button class="linkbtn" data-go="">← Whole house</button></p>`;
}
$('panel').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (!b) return; if (b.dataset.go) select(b.dataset.go); else { select(null, true); floorSel = 'all'; sync(); view(); } });

/* Click on a device */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
el.addEventListener('pointerup', e => {

});

/* Layout and loop */
function size() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); const side = innerWidth <= 820 ? 0 : rackView ? Math.min(innerWidth * .48, 680) + 24 : 352; camera.aspect = w / h; camera.setViewOffset(w, h, side / 2, 0, w, h); camera.updateProjectionMatrix(); }

const clock = new THREE.Clock(), v = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), camDir = new THREE.Vector3();

/* Live reachability: an opaque reply proves the server answered, nothing more */
