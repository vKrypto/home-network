    const svc = new Set(Object.values(DEVICES).flatMap(d => d.services.filter(s => /^https?:/.test(s[1] || '')).map(s => s[1])));
    const up = [...svc].filter(u => status[u]).length;
    const list = [...FLOORS].reverse().map(f => `<h4>${f.name}</h4><ul>${Object.entries(DEVICES).filter(([, d]) => d.floor === f.id).map(([k, d]) => `<li><button class="linkbtn" data-go="${k}">${esc(d.name)}</button>${d.ip ? ` <span class="sub">· ${esc(d.ip)}</span>` : ''}</li>`).join('')}</ul>`).join('');
    box.innerHTML = `<h3>The house at a glance</h3><p class="sub" style="margin:6px 0">Internet comes in from the street to the top floor. One Ethernet run feeds the AP on the second floor, which feeds the routers below.</p>
      <dl class="kv"><dt>Web services answering</dt><dd>${location.protocol === 'https:' ? 'Only checked on a local copy' : checked ? up + ' of ' + svc.size : 'Checking…'}</dd><dt>Wi-Fi networks</dt><dd>Ashutosh, Ashutosh-Secured</dd><dt>Cable colours</dt><dd><span style="color:#6ea8fe">Blue</span> Ethernet, <span style="color:#4fd1c5">teal</span> NFS, <span style="color:#f2c063">amber</span> Wi-Fi, <span style="color:#c39bff">purple</span> virtual</dd></dl>${list}
      <p class="note">Select "See inside" to lift the floors apart, or pick a device to go to it. Drag to orbit, scroll to zoom.</p>
      <p class="note" style="margin-bottom:0">Devices and addresses come from local.internal (snapshot 5 Nov 2026), without logins. The house, rooms and cable routes are placeholders. A grey dot means no reply to this browser, which doesn't prove a service is down.</p>`;
    return;
  }
  const d = DEVICES[selected], floor = FLOORS.find(f => f.id === d.floor).name;
  const conns = LINKS.filter(l => l.a === selected || l.b === selected).map(l => { const o = l.a === selected ? l.b : l.a; return `<li>${o === 'inet' ? 'Internet' : `<button class="linkbtn" data-go="${o}">${esc(DEVICES[o].name)}</button>`} <span class="sub">· ${esc(l.label)}</span></li>`; }).join('');
  const svcs = d.services.map(([n, u, note]) => { const t = note ? ` <span class="sub">· ${esc(note)}</span>` : ''; return u ? `<li>${/^https?:/.test(u) ? `<span class="dot${status[u] ? ' up' : ''}"></span>` : ''}<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>${t}</li>` : `<li>${esc(n)}${t}</li>`; }).join('');
  const facts = { ...(d.ip && !['pc', 'store'].includes(d.kind) ? { Address:d.ip } : {}), ...d.facts };
  box.innerHTML = `<h3>${esc(d.name)}</h3><div class="sub">${esc(d.role)} · ${floor}</div><h4>Details</h4><dl class="kv">${Object.entries(facts).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <h4>Connected to</h4><ul>${conns}</ul>${svcs ? `<h4>Services</h4><ul>${svcs}</ul>` : ''}<p style="margin:12px 0 0"><button class="linkbtn" data-go="">← Whole house</button></p>`;
}
$('panel').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (!b) return; if (b.dataset.go) select(b.dataset.go); else { select(null, true); floorSel = 'all'; sync(); view(); } });

/* Click on a device */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
el.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = el.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(hits.filter(m => devObjs[m.userData.id].g.parent.visible), false)[0];
  if (h && mode === 'inside') select(h.object.userData.id);
});

/* Layout and loop */
function size() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); const side = innerWidth > 820 ? 352 : 0; camera.aspect = w / h; camera.setViewOffset(w, h, side / 2, 0, w, h); camera.updateProjectionMatrix(); }
addEventListener('resize', size); size();
const clock = new THREE.Clock(), v = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), camDir = new THREE.Vector3();
const NORMALS = { front:[0, 1], back:[0, -1], left:[-1, 0], right:[1, 0] };
function stretch(m, a, b) { v.subVectors(b, a); m.position.copy(a).addScaledVector(v, .5); m.scale.set(1, v.length(), 1); m.quaternion.setFromUnitVectors(up, v.clone().normalize()); }
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .25), inside = mode === 'inside';
  spread += ((inside ? 1 : 0) - spread) * Math.min(1, dt * 3.5);
  if (Math.abs(spread - (inside ? 1 : 0)) < .001) spread = inside ? 1 : 0;
  FLOORS.forEach(f => { floorGroups[f.id].position.y = floorY(f.id); }); roof.position.y = floorY('roof');
  if (tween) { const a = 1 - Math.exp(-dt * 3.5); camera.position.lerp(tween.p, a); controls.target.lerp(tween.t, a); if (camera.position.distanceTo(tween.p) < .02) tween = null; }
  controls.update();
  camDir.subVectors(camera.position, controls.target).setY(0).normalize();
  Object.entries(sideGroups).forEach(([s, gs]) => { const [nx, nz] = NORMALS[s], hide = spread > .02 && nx * camDir.x + nz * camDir.z > .2; gs.forEach(g => { g.visible = !hide; }); });
  partitions.forEach(g => { g.scale.y = 1 - spread * .62; });
  stretched.forEach(s => { const lo = new THREE.Vector3(s.x, floorY(s.b) + .05, s.z), hi = new THREE.Vector3(s.x, floorY(s.a) + .05, s.z); stretch(s.m, lo, hi); s.m.visible = floorSel === 'all' ; });
  stretch(drop, new THREE.Vector3(-11, 9.4, 11.6), new THREE.Vector3(-6, floorY('top') + 2.4, pz(245)));
  drop.visible = floorSel === 'all' || floorSel === 'top';
  const time = clock.elapsedTime;
  pulses.forEach(p => { p.t = (p.t + dt * p.s) % 1; p.pm.position.copy(p.curve.getPointAt(p.t)); p.pm.position.y += .03; });
  leds.forEach((m, i) => { m.visible = Math.sin(time * 5 + i * 1.7) > -.65; });
  waves.forEach(w => { w.t = (w.t + dt * .18) % 1; const s = .5 + w.t * 6; w.m.scale.set(s, s, 1); w.m.material.opacity = inside ? (1 - w.t) * .55 : 0; w.m.visible = inside; });
  Object.values(devObjs).forEach(o => { o.r.rotation.z = time; o.g.traverse(c => { if (c.userData.spin) c.rotation.y = time * .5; }); });
  // labels
  const W = stage.clientWidth, H = stage.clientHeight, placed = [];
  Object.values(devObjs).forEach(o => {
    const show = spread > .6 && o.g.parent.visible;
    o.lab.style.display = show ? 'block' : 'none'; if (!show) return;
    o.g.getWorldPosition(v); v.y += o.d.kind === 'server' || o.d.kind === 'virt' ? 1.75 : 1.3; v.project(camera);
    placed.push({ o, x:(v.x + 1) / 2 * W, y:(1 - v.y) / 2 * H, w:o.lab.offsetWidth, h:o.lab.offsetHeight });
  });
  // stack labels upward where they would overlap
  placed.sort((a, b) => b.y - a.y).forEach((p, i) => {
    for (let moved = true; moved;) { moved = false; for (let j = 0; j < i; j++) { const q = placed[j]; if (Math.abs(p.x - q.x) < (p.w + q.w) / 2 + 3 && Math.abs(p.y - q.y) < (p.h + q.h) / 2 + 2) { p.y = q.y - (p.h + q.h) / 2 - 3; moved = true; } } }
    p.o.lab.style.transform = `translate(-50%,-100%) translate(${p.x}px,${p.y}px)`;
  });
  renderer.render(scene, camera);
}

/* Live reachability: an opaque reply proves the server answered, nothing more */
async function probe(u) { try { await fetch(u, { mode:'no-cors', cache:'no-store', signal:AbortSignal.timeout(4000) }); return true; } catch { return false; } }
const urls = new Set(Object.values(DEVICES).flatMap(d => [d.probe, ...d.services.map(s => s[1])]).filter(u => /^https?:/.test(u || '')));
if (location.protocol !== 'https:') Promise.all([...urls].map(async u => { status[u] = await probe(u); })).then(() => { checked = true; render(); });

window.__home = { select, setMode, setFloor };
sync(); render(); frame();
</script>
</body>
