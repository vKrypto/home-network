<style>
  :root { color-scheme: dark; --bg:#0d1626; --panel:rgba(16,27,46,.92); --line:#2f4364; --ink:#eef3fb; --muted:#9db0ca;
          --router:#6ea8fe; --host:#7ee0a4; --virt:#c39bff; --store:#4fd1c5; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  a { color:var(--router); }
  #stage { position:fixed; inset:0; overflow:hidden; }
  canvas { display:block; }
  #bar { position:absolute; top:12px; left:16px; right:356px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; pointer-events:none; }
  #bar > * { pointer-events:auto; }
  h1 { margin:0 8px 0 0; font-size:20px; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  .seg { display:flex; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { background:none; border:0; color:var(--muted); font:inherit; padding:8px 12px; min-height:36px; cursor:pointer; }
  .seg button[aria-pressed=true] { background:#2a4570; color:var(--ink); }
  .plain-link { font:inherit; cursor:pointer; min-height:36px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; text-decoration:none; color:var(--ink); }
  #wallBtn[aria-pressed=true], #rackBtn[aria-pressed=true], #labelBtn[aria-pressed=true], #panelBtn[aria-pressed=true] { background:#2a4570; }
  body:not(.panel):not(.rack) #panel { display:none; }
  body:not(.panel):not(.rack) #bar { right:16px; }
  body.nolabels #labels { display:none !important; }
  #povBtn { touch-action:none; cursor:grab; }
  #povGhost { position:fixed; z-index:20; pointer-events:none; display:none; color:#f2c063; filter:drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  #povHelp { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:none; gap:6px; align-items:center; flex-wrap:wrap; justify-content:center;
             background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; color:var(--muted); font-size:12.5px; }
  body.pov #povHelp { display:flex; }
  #povHelp button { background:#22314c; border:1px solid var(--line); color:var(--ink); border-radius:6px; min-width:38px; min-height:36px; font:inherit; cursor:pointer; touch-action:none; }
  body.rack #panel { width:min(48vw, 680px); padding:0; overflow:hidden; }
  body.rack #bar { right:min(calc(48vw + 28px), 708px); }
  #panel iframe { display:block; width:100%; height:100%; border:0; }
  #panel { position:absolute; top:12px; right:12px; bottom:12px; width:328px; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  #panel h3 { margin:0; font-size:17px; }
  #panel h4 { margin:14px 0 4px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .sub,.note { color:var(--muted); } .note { font-size:12.5px; }
  .kv { margin:0; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; } .kv dt { color:var(--muted); } .kv dd { margin:0; overflow-wrap:anywhere; }
  ul { list-style:none; margin:0; padding:0; } li { padding:4px 0; border-top:1px solid #2a3c58; overflow-wrap:anywhere; } li:first-child { border-top:0; }
  .linkbtn { background:none; border:0; color:var(--router); font:inherit; padding:0; cursor:pointer; text-align:left; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#5b6b84; margin-right:6px; } .dot.up { background:var(--host); }
  .lab { position:absolute; left:0; top:0; background:rgba(10,18,32,.86); border:1px solid var(--line); border-left:3px solid var(--c); border-radius:5px; color:var(--ink);
         font:600 11.5px/1.25 system-ui,sans-serif; padding:3px 7px; cursor:pointer; white-space:nowrap; text-align:left; transition:opacity .15s; }
  .lab small { display:block; font-weight:400; color:var(--muted); font-size:10.5px; }
  .lab .ssid { display:flex; align-items:center; gap:4px; margin-top:2px; color:#f2c063; font-size:11px; }
  .lab.dim { opacity:.3; } .lab.sel { background:#24406a; }
  #compass { position:absolute; left:16px; bottom:16px; pointer-events:none; }
  #err { position:absolute; inset:0; display:none; place-items:center; padding:24px; text-align:center; }
  @media (max-width:820px) {
    html,body { height:auto; }
    #stage { position:relative; height:62vh; min-height:380px; }
    #bar { right:16px; }
    #panel, body.rack #panel { position:static; width:auto; margin:12px 16px 16px; }
    body.rack #panel { height:70vh; }
    body.rack #bar { right:16px; }
    h1 { width:100%; }
    .lab small { display:none; }
  }

  // find which floor was hit, then drop the house back together and land on that floor
  let o = hit.object, fid = null; while (o) { const k = Object.keys(floorGroups).find(k => floorGroups[k] === o); if (k) { fid = k; break; } o = o.parent; }
  const local = fid ? floorGroups[fid].worldToLocal(hit.point.clone()) : hit.point.clone();
  if (rackView) setRack(false);
  select(null, true); mode = 'outside'; floorSel = 'all'; sync(); spread = 0; tween = null;
  FLOORS.forEach(f => { floorGroups[f.id].position.y = floorY(f.id); }); roof.position.y = floorY('roof'); scene.updateMatrixWorld(true);
  const y = (fid ? floorY(fid, 0) : 0) + local.y;
  const yaw = Math.atan2(camera.position.x - hit.point.x, camera.position.z - hit.point.z);
  pov = { x:local.x, z:local.z, y, yaw:yaw + Math.PI, pitch:0, solid:solids() };
  controls.enabled = false; camera.fov = 70; camera.updateProjectionMatrix();
  document.body.classList.add('pov'); $('povBtn').setAttribute('aria-pressed', true);
}
function stopPov() {
  if (!pov) return; pov = null; povKeys.clear(); controls.enabled = true; camera.fov = 38; camera.updateProjectionMatrix();
  document.body.classList.remove('pov'); $('povBtn').setAttribute('aria-pressed', false); view();
}
function blocked(x, z, nx, nz) {           // wall check at knee and chest height
  const d = new THREE.Vector3(nx - x, 0, nz - z), len = d.length(); if (len < 1e-4) return false; d.normalize();
  return [.45, 1.2].some(hgt => { povRay.set(new THREE.Vector3(x, pov.y + hgt, z), d); povRay.far = len + .25; return povRay.intersectObjects(pov.solid, false).length > 0; });
}
function updatePov(dt) {
  const f = (povKeys.has('f') ? 1 : 0) - (povKeys.has('b') ? 1 : 0), s = (povKeys.has('r') ? 1 : 0) - (povKeys.has('l') ? 1 : 0);
  if (f || s) {
    const sp = (povKeys.has('run') ? 3 : 1.4) * dt, fx = Math.sin(pov.yaw), fz = Math.cos(pov.yaw);
    let nx = pov.x + (fx * f - fz * s) * sp, nz = pov.z + (fz * f + fx * s) * sp;
    if (!blocked(pov.x, pov.z, nx, pov.z)) pov.x = nx;
    if (!blocked(pov.x, pov.z, pov.x, nz)) pov.z = nz;
  }
  const g = groundAt(pov.x, pov.z, pov.y + .5);        // step up stairs (up to 0.5 m), fall down openings
  pov.y = g > pov.y ? g : Math.max(g, pov.y - 9.8 * dt);
  camera.position.set(pov.x, pov.y + EYE, pov.z);
  camera.lookAt(pov.x + Math.sin(pov.yaw) * Math.cos(pov.pitch), pov.y + EYE + Math.sin(pov.pitch), pov.z + Math.cos(pov.yaw) * Math.cos(pov.pitch));
}
// dragging the icon out of the toolbar
$('povBtn').addEventListener('pointerdown', e => {
  if (pov) { stopPov(); return; }
  e.preventDefault(); ghost.style.display = 'block';
  const move = ev => { ghost.style.left = ev.clientX - 17 + 'px'; ghost.style.top = ev.clientY - 30 + 'px'; };
  const up = ev => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); ghost.style.display = 'none'; startPov(ev.clientX, ev.clientY); };
  move(e); addEventListener('pointermove', move); addEventListener('pointerup', up);
});
$('povExit').onclick = stopPov;
const KEYMAP = { KeyW:'f', ArrowUp:'f', KeyS:'b', ArrowDown:'b', KeyA:'l', ArrowLeft:'l', KeyD:'r', ArrowRight:'r', ShiftLeft:'run', ShiftRight:'run' };
addEventListener('keydown', e => { if (!pov) return; if (e.code === 'Escape') return stopPov(); if (KEYMAP[e.code]) { povKeys.add(KEYMAP[e.code]); e.preventDefault(); } });
addEventListener('keyup', e => { if (KEYMAP[e.code]) povKeys.delete(KEYMAP[e.code]); });
document.querySelectorAll('#povHelp [data-k]').forEach(b => { const k = b.dataset.k; b.addEventListener('pointerdown', () => povKeys.add(k)); ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, () => povKeys.delete(k))); });
{ let look = null;                         // drag on the scene to look around
  el.addEventListener('pointerdown', e => { if (pov) look = [e.clientX, e.clientY]; });
  addEventListener('pointermove', e => { if (!pov || !look) return; pov.yaw -= (e.clientX - look[0]) * .004; pov.pitch = Math.max(-1.2, Math.min(1.2, pov.pitch - (e.clientY - look[1]) * .004)); look = [e.clientX, e.clientY]; });
  addEventListener('pointerup', () => { look = null; }); }

el.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
el.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = el.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(hits.filter(m => { const g = devObjs[m.userData.id].g; return g.parent.visible && g.visible; }), false)[0];
  if (pov) return;
  if (h && (seeThrough || mode === 'inside')) select(h.object.userData.id);
});

/* Layout and loop */
function size() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); const side = innerWidth <= 820 ? 0 : rackView ? Math.min(innerWidth * .48, 680) + 24 : panelOpen ? 352 : 0; camera.aspect = w / h; camera.setViewOffset(w, h, side / 2, 0, w, h); camera.updateProjectionMatrix(); }
addEventListener('resize', size); size();
const clock = new THREE.Clock(), v = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), camDir = new THREE.Vector3();
const NORMALS = { front:[0, 1], back:[0, -1], left:[-1, 0], right:[1, 0] };
function stretch(m, a, b) { v.subVectors(b, a); m.position.copy(a).addScaledVector(v, .5); m.scale.set(1, v.length(), 1); m.quaternion.setFromUnitVectors(up, v.clone().normalize()); }
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .25), inside = mode === 'inside';
  spread += ((inside ? 1 : 0) - spread) * Math.min(1, dt * 3.5);
  if (Math.abs(spread - (inside ? 1 : 0)) < .001) spread = inside ? 1 : 0;
  FLOORS.forEach(f => { floorGroups[f.id].position.y = floorY(f.id); }); roof.position.y = floorY('roof');
  if (pov) { spread = 0; tween = null; }
  if (tween) { const a = 1 - Math.exp(-dt * 3.5); camera.position.lerp(tween.p, a); controls.target.lerp(tween.t, a); if (camera.position.distanceTo(tween.p) < .02) tween = null; }
  if (pov) updatePov(dt); else controls.update();
  /* North is the back wall of the house (-z) */
  $('needle').setAttribute('transform', `rotate(${THREE.MathUtils.radToDeg(controls.getAzimuthalAngle())})`);
  camDir.subVectors(camera.position, controls.target).setY(0).normalize();
  Object.entries(sideGroups).forEach(([s, gs]) => { const [nx, nz] = NORMALS[s], hide = !seeThrough && spread > .02 && nx * camDir.x + nz * camDir.z > .2; gs.forEach(g => { g.visible = !hide; }); });
  roomLabels.forEach(m => { m.visible = labelsOn && (seeThrough || spread > .6); });
  partitions.forEach(g => { g.scale.y = seeThrough ? 1 : 1 - spread * .62; });
  stretched.forEach(s => { const lo = new THREE.Vector3(s.x, floorY(s.b) + heightOf(s.b) - .12, s.z), hi = new THREE.Vector3(s.x, floorY(s.a) + (s.a === 'top' ? .05 : heightOf(s.a) - .12), s.z); stretch(s.m, lo, hi); s.m.visible = floorSel === 'all' ; });
  drops.forEach(d => { stretch(d.m, new THREE.Vector3(-8.6, 9.4, 4.2), new THREE.Vector3(px(d.x), floorY('top') + 1.05, HZ)); d.m.visible = floorSel === 'all' || floorSel === 'top'; });
  const time = clock.elapsedTime;
  people.forEach(P => {               // typing hands, glancing across the screens, breathing
    P.hands.forEach((h, i) => { h.position.y = P.base[i] + Math.max(0, Math.sin(time * 13 + i * 2.3 + P.phase)) * .012; });
    P.headGrp.rotation.y = Math.sin(time * .45 + P.phase) * P.look + Math.sin(time * 1.7 + P.phase) * .04;
    P.headGrp.rotation.x = Math.sin(time * .3 + P.phase) * .05;
    P.torso.scale.set(1 + Math.sin(time * 1.6 + P.phase) * .015, 1, 1 + Math.sin(time * 1.6 + P.phase) * .02);
  });
  airDots.forEach(({ l, dots }) => {
    devObjs[l.a].g.getWorldPosition(dotA); devObjs[l.b].g.getWorldPosition(dotB); dotA.y += 1; dotB.y += 1;
    const show = !rackView && floorSel === 'all' && !(spread < .02 && !seeThrough);
    dots.forEach((m, i) => { m.visible = show; m.position.lerpVectors(dotA, dotB, (i + 1 + (time * .8 % 1)) / (dots.length + 1)); });
  });
  pulses.forEach(p => { p.t = (p.t + dt * p.s) % 1; p.pm.position.copy(p.curve.getPointAt(p.t)); p.pm.position.y += .03; });
  leds.forEach((m, i) => { m.visible = Math.sin(time * 5 + i * 1.7) > -.65; });
  waves.forEach(w => { w.t = (w.t + dt * .18) % 1; const s = .5 + w.t * 6; w.m.scale.set(s, s, 1); w.m.material.opacity = inside ? (1 - w.t) * .55 : 0; w.m.visible = inside; });
  Object.values(devObjs).forEach(o => { o.r.rotation.z = time; o.g.traverse(c => { if (c.userData.spin) c.rotation.y = time * .5; }); });
  // labels
  const W = stage.clientWidth, H = stage.clientHeight, placed = [];
  Object.values(devObjs).forEach(o => {
    const show = (seeThrough || spread > .6) && o.g.parent.visible && o.g.visible;
    o.lab.style.display = show ? 'block' : 'none'; if (!show) return;
    o.g.getWorldPosition(v); v.y += o.d.kind === 'server' || o.d.kind === 'virt' ? 1.75 : 1.3; v.project(camera);
    placed.push({ o, x:(v.x + 1) / 2 * W, y:(1 - v.y) / 2 * H, w:o.lab.offsetWidth, h:o.lab.offsetHeight });
  });
  // stack labels upward where they would overlap
  placed.sort((a, b) => b.y - a.y).forEach((p, i) => {
    for (let moved = true; moved;) { moved = false; for (let j = 0; j < i; j++) { const q = placed[j]; if (Math.abs(p.x - q.x) < (p.w + q.w) / 2 + 3 && Math.abs(p.y - q.y) < (p.h + q.h) / 2 + 2) { p.y = q.y - (p.h + q.h) / 2 - 3; moved = true; } } }
    p.o.lab.style.transform = `translate(-50%,-100%) translate(${p.x}px,${p.y}px)`;
  });
  renderer.render(scene, camera);
}

/* Live reachability: an opaque reply proves the server answered, nothing more */
async function probe(u) { try { await fetch(u, { mode:'no-cors', cache:'no-store', signal:AbortSignal.timeout(4000) }); return true; } catch { return false; } }
const urls = new Set(Object.values(DEVICES).flatMap(d => [d.probe, ...d.services.map(s => s[1])]).filter(u => /^https?:/.test(u || '')));
if (location.protocol !== 'https:') Promise.all([...urls].map(async u => { status[u] = await probe(u); })).then(() => { checked = true; render(); });

/* ---------- Views: the house model is always on; each view adds its own objects on its own three.js layer ---------- */
const NETWORK_LAYER = 1;
const networkObjects = {
  devices: Object.values(devObjs).map(o => o.g),
  wires: [...new Set(pulses.map(p => p.pm)), ...stretched.map(x => x.m), ...rackWires],
  wireless: [...waves.map(w => w.m), ...airDots.flatMap(a => a.dots)],
  outside: [pole, poleArm, ...drops.map(d => d.m)],
  rack: [rackModel],
};
scene.traverse(o => { if (o.isMesh && (netMaterials.has(o.material) || o.userData.netWire)) networkObjects.wires.push(o); });
Object.values(networkObjects).flat().forEach(o => o.traverse(c => c.layers.set(NETWORK_LAYER)));
ray.layers.set(NETWORK_LAYER);
const VIEWS = { house:[], network:[NETWORK_LAYER] };
let currentView = 'network';
function setView(name) {
  currentView = name;

setView('network');
window.__home = { select, setMode, setFloor, setRack, setView, startPov, stopPov };
sync(); render(); frame();
