<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// All dimensions in inches.
const LEG_W = 4, LEG_D = 2, LEG_H = 24;   // 4x2 section, 2 ft long
const T = 0.12;                           // steel wall thickness
const LIP = 0.3;                          // return lip on the open face
const STRIP_H = 2;                        // tie strips across the open face
const STRIP_Y = [3, 12, 21];              // strip centres from leg bottom
const SPIGOT = 2;                         // joint tongue length
const CLEAR = 0.04;                       // spigot-to-socket clearance
const SKIRT = 1.5;                        // frame around each shelf plate
const HOLES = Array.from({ length: 12 }, (_, i) => 1 + i * 2); // 2 in pitch
const SHELF_HOLE = { 1: [11], 2: [3, 15], 3: [3, 11, 19], 4: [3, 9, 15, 21] };
// With 4 shelves the top slot is too short for a server under the cover, so it sits one lower.
const serverShelf = n => (n === 4 ? 2 : n - 1);
const CORNERS = [['FL', -1, 1], ['FR', 1, 1], ['BL', -1, -1], ['BR', 1, -1]];
const CATS = {
  joint: { name: 'Leg-to-leg joints (J)', color: '#c2410c' },
  foot:  { name: 'Base sockets (F)',      color: '#6d28d9' },
  shelf: { name: 'Shelf frame screws (S)', color: '#0f766e' },
  cover: { name: 'Top cover (C)',         color: '#b91c1c' },
  leg:   { name: 'Leg ends (L)',          color: '#1d4ed8' },
  hook:  { name: 'Cable hooks (H)',       color: '#a16207' },
  power: { name: 'Power mounts (P)',      color: '#be185d' },
  server: { name: 'Rack servers (V)',     color: '#0369a1' },
  switch: { name: 'Network switches (W)', color: '#4338ca' },
  monitor: { name: 'Side monitor (D)',    color: '#047857' },
};
const catOn = { joint: true, foot: true, shelf: false, cover: true, leg: false, hook: false, power: true, server: true, switch: true, monitor: true };
const accOn = { hook: true, strip: true, inlet: true, server: true, switch: true, monitor: true };
/* ?loadout=topfloor: embedded view with the house's top-floor equipment on the shelves */
const LOADOUT = new URLSearchParams(location.search).get('loadout') === 'topfloor';
if (LOADOUT) {
  document.body.classList.add('embed');
  Object.keys(catOn).forEach(k => { catOn[k] = k === 'server'; });
  accOn.server = accOn.switch = false; accOn.loadout = true;
  document.querySelectorAll('[data-acc=server],[data-acc=switch]').forEach(b => { b.checked = false; });
}

const $ = id => document.getElementById(id);
const view = $('view'), labelsEl = $('labels'), mLabelEl = $('mLabel');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9edf1');
const camera = new THREE.PerspectiveCamera(35, 1, 1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight('#ffffff', '#8a95a0', 1.6));
const sun = new THREE.DirectionalLight('#ffffff', 1.8);
sun.position.set(40, 90, 60);
scene.add(sun);
const fill = new THREE.DirectionalLight('#ffffff', 0.6);
fill.position.set(-60, 30, -50);
scene.add(fill);

const std = (color, m = 0.45, r = 0.55) =>
  new THREE.MeshStandardMaterial({ color, metalness: m, roughness: r, side: THREE.DoubleSide });
const MAT = {
  leg: std('#d3d7db', 0.25, 0.4), legStrip: std('#aeb4ba', 0.25, 0.45), spigot: std('#b08d57'),
  solid: std('#4f7cac'), vent: std('#3f9d8f'), frame: std('#39556f'),
  cover: std('#c9a24b'), foot: std('#6b6f85'), hole: std('#14181c', 0, 0.9), screw: std('#e6e9ec', 0.7, 0.3),
  hook: std('#d9a514', 0.3, 0.5), knob: std('#d9480f', 0.1, 0.6), tray: std('#2f3b46'), strip: std('#f2f2ee', 0, 0.6),
  panel: std('#30363d'), screen: std('#3b6ea5', 0, 0.2), cord: { server: std('#111418', 0, 0.8), switch: std('#111418', 0, 0.8), monitor: std('#111418', 0, 0.8) }, cable: std('#111418', 0, 0.8), power: std('#dc2626', 0, 0.5),
  silver: std('#c4c9ce', 0.55, 0.4), silverDark: std('#8f969c', 0.55, 0.45), bay: std('#1b1f23', 0.3, 0.6), carrier: std('#33393f', 0.3, 0.55),
  ring: std('#101316', 0.2, 0.5), pink: std('#b4587f', 0.1, 0.5), earLabel: std('#2563a8', 0.1, 0.5), led: new THREE.MeshBasicMaterial({ color: '#22c55e' }),
};

let root = null, parts = [], points = [], hot = null, grid = null, cable = null, cords = [], catalog = null, catItems = [], counts = {}, modules = 1;
// Every physical piece is an item, so one screw or one plate can be isolated by itself.
let listGroups = [], items = [], cur = null, collecting = false, shelfLabel = '';
const ITEM_KINDS = { leg: 'Legs', foot: 'Base sockets', tongue: 'Joint tongues', plateSolid: 'Solid base plates', plateVent: 'Vented base plates', frame: 'Shelf frames',
  cover: 'Top cover', screw: 'Fixing screws', bracket: 'L-brackets', hook: 'Cable hooks', strip: 'Power strip mount', inlet: 'Back power mount',
  server: 'Rack servers', switch: 'Network switches', monitor: 'Side monitor' };
function partOf(g) { while (g && !parts.includes(g)) g = g.parent; return g; }
function newItem(g, name, kind, desc = '') {
  if (!collecting) return null;
  const it = { name, kind, desc, group: partOf(g), meshes: [] };
  items.push(it);
  return it;
}
function begin(g, name, kind, desc) { cur = newItem(g, name, kind, desc); }
const track = m => { if (cur) cur.meshes.push(m); return m; };
const box = (g, w, h, d, x, y, z, mat) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  g.add(m);
  track(m);
  return m;
};
const cyl = (g, r, len, pos, axis, mat) => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 14), mat);
  if (axis === 'x') m.rotation.z = Math.PI / 2;
  if (axis === 'z') m.rotation.x = Math.PI / 2;
  m.position.copy(pos);
  g.add(m);
  track(m);
};
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

function addPart(tag, explode, acc = null) {
  const g = new THREE.Group();
  g.userData = { tag, explode, acc };
  root.add(g);
  parts.push(g);
  return g;
}
function addPoint(group, name, desc, cat, pos) {
  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 12, 10),
    new THREE.MeshBasicMaterial({ color: CATS[cat].color, depthTest: false, transparent: true }));
  marker.renderOrder = 5;
  marker.position.copy(pos);
  group.add(marker);
  const el = document.createElement('div');
  el.className = 'pt';
  el.textContent = name;
  el.style.background = CATS[cat].color;
  labelsEl.append(el);
  points.push({ name, desc, cat, group, marker, el });
  // Name the screw at this point after it.
  let best = null, bestD = 0.25;
  for (const it of items) {
    if (it.kind !== 'screw' || it.named || it.group !== group) continue;
    const d = it.pos.distanceTo(pos);
    if (d < bestD) { best = it; bestD = d; }
  }
  if (best) { best.name = `Screw ${name}`; best.desc = desc; best.named = true; }
}

// The one fixing used everywhere: same thread and length, hand-turned knob head.
// Sizes in inches: M6 x 1.0 thread, 16 mm under the head, 16 mm knurled knob, 4 mm hex socket.
const MM = 1 / 25.4;
const SCREW = { major: 3 * MM, minor: 3 * MM - 0.6134 * MM, pitch: 1 * MM, length: 16 * MM, knobR: 8 * MM, knobH: 6 * MM, collarR: 4.5 * MM, collarH: 1.2 * MM, hexAF: 4 * MM };

// A true helical thread: a ring of vertices per row, radius following the V profile.
function threadGeometry() {
  const { major, minor, pitch, length, knobH, collarH } = SCREW;
  const seg = 30, start = knobH / 2 + collarH, end = knobH / 2 + length, rows = Math.round((end - start) / pitch * 5);
  const chamfer = major - minor + 0.3 * MM;
  const pos = [], idx = [];
  for (let r = 0; r <= rows; r++) {
    const y = start + (end - start) * r / rows;
    for (let k = 0; k < seg; k++) {
      const th = k / seg * Math.PI * 2;
      const f = ((y / pitch - th / (Math.PI * 2)) % 1 + 1) % 1;
      let rad = minor + (major - minor) * (1 - Math.abs(2 * f - 1));
      rad = Math.min(rad, minor - 0.3 * MM + (end - y) / chamfer * (major - minor + 0.3 * MM));  // chamfered tip
      pos.push(Math.cos(th) * rad, y, Math.sin(th) * rad);
    }
  }
  for (let r = 0; r < rows; r++) for (let k = 0; k < seg; k++) {
    const a = r * seg + k, b = r * seg + (k + 1) % seg, c = a + seg, d = b + seg;
    idx.push(a, c, b, b, c, d);
  }
  const tip = pos.length / 3;                 // flat end
  pos.push(0, end, 0);
  for (let k = 0; k < seg; k++) idx.push(rows * seg + k, tip, rows * seg + (k + 1) % seg);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
// Knob: fluted grip around the rim, hex socket in the middle, slightly chamfered edges.
function knobGeometry() {
  const { knobR, knobH, hexAF } = SCREW;
  const flutes = 18, pts = flutes * 6, shape = new THREE.Shape();
  for (let k = 0; k <= pts; k++) {
    const th = k / pts * Math.PI * 2;
    const rad = knobR * (0.95 + 0.05 * Math.cos(th * flutes));
    k ? shape.lineTo(Math.cos(th) * rad, Math.sin(th) * rad) : shape.moveTo(Math.cos(th) * rad, Math.sin(th) * rad);
  }
  const hexR = hexAF / 2 / Math.cos(Math.PI / 6), hole = new THREE.Path();
  for (let k = 6; k >= 0; k--) {
    const th = k / 6 * Math.PI * 2, x = Math.cos(th) * hexR, y = Math.sin(th) * hexR;
    k === 6 ? hole.moveTo(x, y) : hole.lineTo(x, y);
  }
  shape.holes.push(hole);
  const bevel = 0.4 * MM;
  const g = new THREE.ExtrudeGeometry(shape, { depth: knobH - 2 * bevel, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelOffset: -bevel, bevelSegments: 1 });
  g.rotateX(-Math.PI / 2);
  g.translate(0, -knobH / 2 + bevel, 0);
  return g;
}
const screwGeo = {};
function getScrewGeo() {
  if (screwGeo.thread) return screwGeo;
  const { collarR, collarH, knobH, hexAF, minor } = SCREW;
  screwGeo.thread = threadGeometry();
  screwGeo.knob = knobGeometry();
  screwGeo.collar = new THREE.CylinderGeometry(collarR, collarR, collarH, 24);
  screwGeo.collar.translate(0, knobH / 2 + collarH / 2, 0);
  screwGeo.core = new THREE.CylinderGeometry(minor, minor, collarH * 1.5, 24);
  screwGeo.core.translate(0, knobH / 2 + collarH, 0);
  // Bottom of the socket: recessed 3 mm from the knob face.
  screwGeo.socket = new THREE.CylinderGeometry(hexAF / 2 / Math.cos(Math.PI / 6), hexAF / 2 / Math.cos(Math.PI / 6), knobH - 3 * MM, 6);
  screwGeo.socket.rotateY(Math.PI / 2);
  screwGeo.socket.translate(0, 1.5 * MM, 0);
  return screwGeo;
}
const Y_AXIS = new THREE.Vector3(0, 1, 0);
function screw(g, pos, axis, out) {
  const prev = cur;
  cur = newItem(g, 'Screw', 'screw');
  if (cur) cur.pos = pos.clone();
  const dir = v3(0, 0, 0);
  dir[axis] = out;
  const G = getScrewGeo();
  for (const [geo, mat] of [[G.thread, MAT.screw], [G.core, MAT.screw], [G.collar, MAT.screw], [G.knob, MAT.knob], [G.socket, MAT.bay]]) {
    const m = new THREE.Mesh(geo, mat);
    m.position.copy(pos);
    m.quaternion.setFromUnitVectors(Y_AXIS, dir);
    g.add(m);
    track(m);
  }
  cur = prev;
}
const thumb = screw;

// Shared L-bracket for the strip, server and switch. Inverted when hung under a shelf.
let bare = false;   // parts view: draw a part without its loose brackets and tongue
function bracket(g, s, x, y, zc, hung = false) {
  if (bare) return;
  const prev = cur;
  cur = newItem(g, `${prev ? prev.name : ''} bracket ${s < 0 ? 'L' : 'R'}`, 'bracket', `Holds ${prev ? prev.name : 'equipment'} to its shelf`);
  const dir = hung ? -1 : 1;
  box(g, 0.1, 1.2, 3, s * (x + 0.05), y + dir * 0.6, zc, MAT.hook);
  box(g, 0.8, 0.1, 3, s * (x + 0.45), y + dir * 0.05, zc, MAT.hook);
  screw(g, v3(s * (x + 0.5), y + dir * 0.2, zc), 'y', -dir);
  cur = prev;
}

// Shared 4 in joint tongue: three-sided, so the wire channel stays clear.
function buildTongue(g, cx, cz, sz, y) {
  const prev = cur;
  cur = newItem(g, `${prev ? prev.name : ''} tongue`, 'tongue', `Joins ${prev ? prev.name : 'this part'} to the next part`);
  const w = LEG_W - 2 * T - CLEAR, d = LEG_D - 2 * T - CLEAR;
  box(g, w, 4, T, cx, y, cz - sz * (d - T) / 2, MAT.spigot);
  for (const s of [-1, 1]) box(g, T, 4, d, cx + s * (w - T) / 2, y, cz, MAT.spigot);
  for (const dy of [-1, 1]) cyl(g, 0.13, 0.05, v3(cx, y + dy, cz - sz * (d - T) / 2), 'z', MAT.hole);
  cur = prev;
}

function buildHook(g, sx, y, z, a) {
  box(g, T, 2.4, 1.2, sx * (a + T / 2), y, z, MAT.hook);
  box(g, 1.3, 0.25, 0.6, sx * (a + 0.65), y - 0.9, z, MAT.hook);
  box(g, 0.22, 0.8, 0.6, sx * (a + 1.3), y - 0.6, z, MAT.hook);
  thumb(g, v3(sx * (a + 0.2), y, z), 'x', -sx);
}

function buildStrip(g, top, W, D) {
  const b = D / 2, ax = W / 2 - LEG_W;
  const L = Math.min(14, 2 * ax - 2), zc = -(b - 2.2);
  box(g, L + 2, 0.08, 3.4, 0, top + 0.04, zc, MAT.tray);          // marked mounting area
  box(g, L, 1.3, 2, 0, top + 0.73, zc, MAT.strip);                // the power strip
  const n = Math.max(1, Math.floor(L / 2.2));
  for (let i = 0; i < n; i++) {
    const x = (i - (n - 1) / 2) * 2.2;
    cyl(g, 0.55, 0.04, v3(x, top + 1.39, zc), 'y', MAT.panel);
  }
  for (const s of [-1, 1]) bracket(g, s, L / 2, top + 0.08, zc);   // end clamps
  box(g, L, 0.1, 0.1, 0, top + 0.95, zc - 1.4, MAT.hook);         // cable comb rail
  box(g, L, 0.85, 0.08, 0, top + 0.5, zc - 1.4, MAT.tray);
  for (let x = -L / 2; x <= L / 2 + 0.01; x += L / Math.max(1, Math.round(L / 1.2)))
    box(g, 0.08, 0.5, 0.25, x, top + 1.2, zc - 1.4, MAT.hook);
  const sockets = Array.from({ length: n }, (_, i) => (i - (n - 1) / 2) * 2.2);
  return { clampX: L / 2 + 0.55, cableX: L / 2 - 0.5, zc, sockets };
}

// 2U, 12-bay server modelled on the reference photo: silver chassis, 4 x 3 large
// drive carriers, a label ear on the left and a control panel ear on the right.
const SERVER = { w: 18, h: 4, d: 32, ear: 0.68 };
function buildServer(g, top, w, depth, zc) {
  const h = SERVER.h, y = top + h / 2 + 0.1, front = zc + depth / 2, f = front + 0.05;
  box(g, w, h, depth, 0, y, zc, MAT.silver);
  box(g, w * 0.98, 0.02, depth * 0.28, 0, y + h / 2 + 0.01, front - depth * 0.14, MAT.silverDark);   // front lid panel
  box(g, 1.6, 0.04, 0.7, 0, y + h / 2 + 0.03, front - depth * 0.36, MAT.bay);                        // lid latch
  box(g, w, h, 0.1, 0, y, f, MAT.bay);                                                               // bay frame

  // Drive carriers
  const cols = 4, rows = 3, gap = 0.08, inW = w - 0.3, inH = h - 0.24;
  const cw = (inW - gap * (cols - 1)) / cols, ch = (inH - gap * (rows - 1)) / rows;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const x = -inW / 2 + cw / 2 + i * (cw + gap), yy = y + inH / 2 - ch / 2 - j * (ch + gap), z = f + 0.07;
    box(g, cw, ch, 0.05, x, yy, z, MAT.carrier);
    box(g, cw * 0.3, ch * 0.72, 0.03, x - cw * 0.3, yy, z + 0.03, MAT.silverDark);                   // release handle
    box(g, cw * 0.2, ch * 0.12, 0.02, x - cw * 0.3, yy + ch * 0.18, z + 0.05, MAT.bay);
    cyl(g, ch * 0.2, 0.03, v3(x + cw * 0.14, yy, z + 0.04), 'z', MAT.ring);                          // status ring
    cyl(g, ch * 0.13, 0.03, v3(x + cw * 0.14, yy, z + 0.06), 'z', MAT.led);
    box(g, cw * 0.11, ch * 0.62, 0.03, x + cw * 0.37, yy, z + 0.03, MAT.pink);                       // do-not-remove tab
  }

  // Mounting ears, only when the rack is wide enough to take them
  const e = SERVER.ear;
  if (w >= SERVER.w) for (const s of [-1, 1]) box(g, e, h, 0.14, s * (w / 2 + e / 2), y, f, MAT.silver);
  if (w >= SERVER.w) {
    const xl = -(w / 2 + e / 2), xr = w / 2 + e / 2, z = f + 0.09;
    box(g, e * 0.6, 0.45, 0.02, xl, y - 0.9, z, MAT.earLabel);                                        // left label
    box(g, e * 0.7, h * 0.72, 0.02, xr, y + 0.1, z, MAT.bay);                                         // control panel
    cyl(g, 0.11, 0.03, v3(xr, y + 0.95, z + 0.02), 'z', MAT.led);                                     // power
    box(g, e * 0.4, 0.05, 0.02, xr, y + 0.5, z + 0.02, MAT.led);
    box(g, e * 0.4, 0.05, 0.02, xr, y + 0.3, z + 0.02, MAT.led);
    box(g, e * 0.42, 0.2, 0.02, xr, y - 0.6, z + 0.02, MAT.silverDark);                               // USB
  }

  // Rear: dark panel with two power supplies and network ports
  const r = zc - depth / 2 - 0.03;
  box(g, w, h, 0.06, 0, y, r, MAT.bay);
  for (const s of [0, 1]) box(g, 2.6, 1.5, 0.06, w / 2 - 1.5 - s * 2.8, y - 0.8, r - 0.05, MAT.silverDark);
  for (let i = 0; i < 4; i++) box(g, 0.5, 0.45, 0.06, -w / 2 + 1 + i * 0.65, y - 1, r - 0.05, MAT.silver);

  for (const s of [-1, 1]) bracket(g, s, w / 2, top, zc);
}

// 1U switch modelled on the reference photo: silver lid, black front, console port,
// 48 network ports in four blocks of 12 and four uplink ports on the right.
const SWITCH = { w: 17.3, h: 1.75, d: 10, ear: 0.75 };
function buildSwitch(g, base, w, depth, zc, hangTop) {
  const h = SWITCH.h, y = base + h / 2, front = zc + depth / 2, f = front + 0.04, z = f + 0.05;
  box(g, w, h, depth, 0, y, zc, MAT.silver);
  box(g, w, h, 0.08, 0, y, f, MAT.bay);
  if (w >= SWITCH.w) for (const s of [-1, 1]) box(g, SWITCH.ear, h, 0.1, s * (w / 2 + SWITCH.ear / 2 - 0.1), y, f, MAT.bay);

  box(g, 0.45, 0.4, 0.04, -w / 2 + 0.55, y - 0.3, z, MAT.silverDark);        // console port
  box(g, 0.4, 0.3, 0.02, -w / 2 + 0.55, y + 0.4, z, MAT.earLabel);           // badge
  const left = -w / 2 + 1.1, right = w / 2 - 1.75, groupGap = 0.16;
  const pw = (right - left - groupGap * 3) / 48 * 2;
  for (let c = 0; c < 24; c++) for (let row = 0; row < 2; row++) {
    const x = left + pw * (c + 0.5) + groupGap * Math.floor(c / 6);
    const py = y + (row ? 0.34 : -0.3);
    box(g, pw * 0.88, 0.5, 0.03, x, py, z, MAT.silverDark);
    box(g, pw * 0.62, 0.3, 0.03, x, py - 0.03, z + 0.02, MAT.bay);
    box(g, pw * 0.25, 0.05, 0.02, x, py + 0.18, z + 0.03, MAT.led);
  }
  for (let c = 0; c < 2; c++) for (let row = 0; row < 2; row++) {            // uplinks
    const x = w / 2 - 1.3 + c * 0.72, py = y + (row ? 0.34 : -0.3);
    box(g, 0.62, 0.42, 0.03, x, py, z, MAT.silverDark);
    box(g, 0.48, 0.24, 0.03, x, py, z + 0.02, MAT.bay);
  }
  for (const s of [-1, 1]) bracket(g, s, w / 2, hangTop !== undefined ? hangTop : base, zc, hangTop !== undefined);
}

// Grafana-style node exporter dashboard for the monitor. Simulated values, not read from a real server.
const dashCanvas = document.createElement('canvas'); dashCanvas.width = 1280; dashCanvas.height = 720;
const dashTex = new THREE.CanvasTexture(dashCanvas); dashTex.colorSpace = THREE.SRGBColorSpace; dashTex.anisotropy = 8;
const dashMat = new THREE.MeshBasicMaterial({ map: dashTex, toneMapped: false });
const DASH_N = 90;
const walk = (mid, spread, min, max) => {
  let v = mid; const next = () => { v += (mid - v) * 0.08 + (Math.random() - 0.5) * spread; if (Math.random() < 0.03) v += spread * 2.5 * Math.random(); return v = Math.min(max, Math.max(min, v)); };
  const hist = []; for (let i = 0; i < DASH_N; i++) hist.push(next());
  return { hist, tick() { hist.push(next()); hist.shift(); }, get now() { return hist[hist.length - 1]; } };
};
const DASH = { user: walk(24, 6, 2, 70), sys: walk(9, 3, 1, 30), iow: walk(3, 2, 0, 20), ram: walk(62, 1, 40, 90), cache: walk(21, 0.6, 8, 40),
  rx: walk(180, 70, 2, 900), tx: walk(70, 40, 1, 600), rd: walk(45, 30, 0, 400), wr: walk(85, 35, 0, 400), load: walk(1.9, 0.3, 0.1, 8) };
let dashLast = 0, dashUp = 1987200;
function drawDash(now) {
  if (now - dashLast < 1000 && dashLast) return;
  dashLast = now; dashUp += 1;
  Object.values(DASH).forEach(w => w.tick());
  const c = dashCanvas.getContext('2d'), W = 1280, F = 'Arial, Helvetica, sans-serif';
  const GREEN = '#73bf69', YEL = '#f2cc0c', RED = '#f2495c', BLUE = '#5794f2', ORG = '#ff9830', PUR = '#b877d9';
  const thresh = v => v > 85 ? RED : v > 70 ? YEL : GREEN;
  c.fillStyle = '#111217'; c.fillRect(0, 0, W, 720);
  c.textBaseline = 'alphabetic'; c.textAlign = 'left';
  c.fillStyle = '#d8d9da'; c.font = `bold 26px ${F}`; c.fillText('Node Exporter', 20, 36);
  c.fillStyle = '#8e8e8e'; c.font = `19px ${F}`; c.fillText('host: rack-server-01   |   Last 15 minutes   |   simulated data', 215, 35);
  const panel = (x, y, w, h, title) => { c.fillStyle = '#181b1f'; c.fillRect(x, y, w, h); c.strokeStyle = '#2a2d33'; c.strokeRect(x + .5, y + .5, w - 1, h - 1); c.fillStyle = '#ccccdc'; c.font = `bold 18px ${F}`; c.textAlign = 'center'; c.fillText(title, x + w / 2, y + 25); c.textAlign = 'left'; };
  const gauge = (x, y, w, h, title, v) => {
    panel(x, y, w, h, title);
    const cx = x + w / 2, cy = y + h - 58, r = Math.min(w * .3, h * .38), s = Math.PI * .85, e = Math.PI * 2.15, col = thresh(v);
    c.lineWidth = 18; c.strokeStyle = '#2c3036'; c.beginPath(); c.arc(cx, cy, r, s, e); c.stroke();
    c.strokeStyle = col; c.beginPath(); c.arc(cx, cy, r, s, s + (e - s) * v / 100); c.stroke();
    c.fillStyle = col; c.font = `bold 28px ${F}`; c.textAlign = 'center'; c.fillText(v.toFixed(1) + '%', cx, cy + 10); c.textAlign = 'left';
  };
  const stat = (x, y, w, h, title, val, col) => { panel(x, y, w, h, title); c.fillStyle = col; c.font = `bold 40px ${F}`; c.textAlign = 'center'; c.fillText(val, x + w / 2, y + h / 2 + 30); c.textAlign = 'left'; };
  const graph = (x, y, w, h, title, series, unit, stacked) => {
    panel(x, y, w, h, title);
    const l = x + 62, r = x + w - 12, t = y + 38, b = y + h - 42, n = DASH_N;
    let max = stacked ? 100 : Math.max(...series.flatMap(s => s.w.hist)) * 1.15;
    if (!stacked) max = Math.ceil(max / 50) * 50 || 50;
    c.font = `15px ${F}`;
    for (let i = 0; i <= 4; i++) { const yy = b - (b - t) * i / 4; c.strokeStyle = '#26292f'; c.lineWidth = 1; c.beginPath(); c.moveTo(l, yy); c.lineTo(r, yy); c.stroke(); c.fillStyle = '#8e8e8e'; c.textAlign = 'right'; c.fillText(Math.round(max * i / 4) + unit, l - 7, yy + 5); }
    c.textAlign = 'left';
    const base = new Array(n).fill(0);
    series.forEach(s => {
      const pts = s.w.hist.map((v, i) => { const top = stacked ? base[i] + v : v; const p = [l + (r - l) * i / (n - 1), b - (b - t) * Math.min(1, top / max), stacked ? b - (b - t) * Math.min(1, base[i] / max) : b]; if (stacked) base[i] = top; return p; });
      c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); [...pts].reverse().forEach(p => c.lineTo(p[0], p[2])); c.closePath();
      c.globalAlpha = .22; c.fillStyle = s.col; c.fill(); c.globalAlpha = 1;
      c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.strokeStyle = s.col; c.lineWidth = 2; c.stroke();
    });
    let lx = l; c.font = `15px ${F}`;
    series.forEach(s => { const txt = `${s.name} ${s.w.now.toFixed(s.w.now < 100 ? 1 : 0)}${unit}`; c.fillStyle = s.col; c.fillRect(lx, b + 15, 14, 4); c.fillStyle = '#ccccdc'; c.fillText(txt, lx + 19, b + 23); lx += c.measureText(txt).width + 36; });
  };
  const cpu = DASH.user.now + DASH.sys.now + DASH.iow.now, ram = DASH.ram.now;
  const d = Math.floor(dashUp / 86400), hrs = Math.floor(dashUp % 86400 / 3600);
  gauge(12, 52, 245, 165, 'CPU Busy', cpu);
  gauge(265, 52, 245, 165, 'Sys Load (per core)', DASH.load.now / 8 * 100);
  gauge(518, 52, 245, 165, 'RAM Used', ram);
  gauge(771, 52, 245, 165, 'Root FS Used', 47.3);
  stat(1024, 52, 244, 80, 'Uptime', `${d}d ${hrs}h`, GREEN);
  stat(1024, 137, 244, 80, 'CPU Cores / RAM', '8 / 32 GB', BLUE);
  graph(12, 225, 624, 240, 'CPU Basic', [{ name: 'user', w: DASH.user, col: GREEN }, { name: 'system', w: DASH.sys, col: YEL }, { name: 'iowait', w: DASH.iow, col: RED }], '%', true);
  graph(644, 225, 624, 240, 'Memory Basic', [{ name: 'used', w: DASH.ram, col: BLUE }, { name: 'cache', w: DASH.cache, col: ORG }], '%', true);
  graph(12, 473, 624, 238, 'Network Traffic', [{ name: 'rx', w: DASH.rx, col: GREEN }, { name: 'tx', w: DASH.tx, col: BLUE }], ' Mb', false);
  graph(644, 473, 624, 238, 'Disk I/O', [{ name: 'read', w: DASH.rd, col: PUR }, { name: 'write', w: DASH.wr, col: ORG }], ' MB', false);
  dashTex.needsUpdate = true;
}

// 16:9 monitor (size is the diagonal) on a rail across two legs' outer 2 in faces.
function buildMonitor(g, sx, a, y, zEnd, size) {
  const sw = size * 0.872, sh = size * 0.49;
  box(g, T, 1.5, 2 * zEnd + 1.5, sx * (a + T / 2), y, 0, MAT.silverDark);          // rail
  box(g, 0.9, 1, 1, sx * (a + 0.55), y, 0, MAT.silverDark);                        // arm
  box(g, 0.1, 3, 3, sx * (a + 1.05), y, 0, MAT.silverDark);                        // VESA plate
  box(g, 0.7, sh + 0.7, sw + 0.7, sx * (a + 1.45), y, 0, MAT.bay);                 // body
  box(g, 0.03, sh, sw, sx * (a + 1.81), y, 0, MAT.screen);                         // screen
  const dash = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), dashMat);           // live-looking dashboard
  dash.position.set(sx * (a + 1.83), y, 0);
  dash.rotation.y = sx * Math.PI / 2;
  g.add(dash);
  box(g, 0.03, 0.08, 0.08, sx * (a + 1.81), y - sh / 2 - 0.2, sw / 2 - 0.2, MAT.led);
  for (const s of [-1, 1]) thumb(g, v3(sx * (a + 0.2), y, s * zEnd), 'x', -sx);
}

// Rear panel spanning the two back legs; its bent ends fix to their 2 in faces.
function buildInlet(g, y, W, D) {
  const b = D / 2, ax = W / 2 - LEG_W, cz = -(b - LEG_D / 2);
  box(g, 2 * ax, 2.4, T, 0, y, -(b - T / 2), MAT.frame);
  for (const s of [-1, 1]) box(g, T, 2.4, LEG_D, s * (ax - T / 2), y, cz, MAT.frame);
  const w = Math.min(4, 2 * ax - 1);
  box(g, w, 2, 0.6, 0, y, -(b + 0.3), MAT.panel);
  box(g, 0.7, 0.5, 0.1, -w / 4, y, -(b + 0.65), MAT.power);       // switch
  for (const dx of [-0.3, 0, 0.3]) cyl(g, 0.09, 0.1, v3(w / 4 + dx, y, -(b + 0.65)), 'z', MAT.strip);
  return w;
}

// A cable path of straight runs joined by small rounded bends.
function cableRoute(pts, bend = 0.3) {
  const p = pts.filter((q, i) => !i || q.distanceTo(pts[i - 1]) > 1e-3);
  const path = new THREE.CurvePath();
  let from = p[0];
  for (let i = 1; i < p.length; i++) {
    if (i === p.length - 1) { path.add(new THREE.LineCurve3(from, p[i])); break; }
    const inD = p[i].clone().sub(p[i - 1]), outD = p[i + 1].clone().sub(p[i]);
    const rad = Math.min(bend, inD.length() / 2, outD.length() / 2);
    const a = p[i].clone().addScaledVector(inD.normalize(), -rad), b = p[i].clone().addScaledVector(outD.normalize(), rad);
    path.add(new THREE.LineCurve3(from, a));
    path.add(new THREE.QuadraticBezierCurve3(a, p[i].clone(), b));
    from = b;
  }
  return path;
}

function buildLeg(g, cx, cz, sx, sz, W, D) {
  const y = LEG_H / 2;
  const bz = sz * (D / 2 - LEG_D + T / 2);       // solid inner 4 in face
  const openZ = sz * (D / 2 - T / 2);            // open outer 4 in face
  box(g, LEG_W, LEG_H, T, cx, y, bz, MAT.leg);
  for (const s of [-1, 1]) {
    box(g, T, LEG_H, LEG_D, cx + s * (LEG_W - T) / 2, y, cz, MAT.leg);
    box(g, LIP, LEG_H, T, cx + s * (LEG_W / 2 - LIP / 2), y, openZ, MAT.leg);
  }
  for (const sy of STRIP_Y) box(g, LEG_W, STRIP_H, T, cx, sy, openZ, MAT.legStrip);

  if (!bare) buildTongue(g, cx, cz, sz, 0);   // joins this leg to the part below

  // Screw holes on the two solid inner faces, plus one through the spigot.
  const holeBack = y0 => cyl(g, 0.13, 0.5, v3(cx, y0, bz), 'z', MAT.hole);
  const holeSide = y0 => cyl(g, 0.13, 0.3, v3(cx - sx * (LEG_W - T) / 2, y0, cz), 'x', MAT.hole);
  HOLES.forEach(h => {
    holeBack(h); holeSide(h);
    cyl(g, 0.13, 0.3, v3(cx + sx * (LEG_W - T) / 2, h, cz), 'x', MAT.hole); // outer face, for hooks
  });
}

// One copy of every component, separate from the assembly, for the parts views.
function buildCatalog(W, D, M) {
  if (catalog) scene.remove(catalog);
  catalog = new THREE.Group();
  scene.add(catalog);
  const a = W / 2, b = D / 2, cx = a - LEG_W / 2, cz = b - LEG_D / 2;
  const defs = [
    ['leg', 'Leg', () => 4 * M, g => buildLeg(g, cx, cz, 1, 1, W, D)],
    ['plateSolid', 'Solid base plate', () => counts.solid, g => buildShelf(g, 'solid', 0, W, D, 'plate')],
    ['plateVent', 'Vented base plate', () => counts.vent, g => buildShelf(g, 'vent', 0, W, D, 'plate')],
    ['frame', 'Shelf frame', () => counts.solid + counts.vent, g => buildShelf(g, 'solid', 0, W, D, 'frame')],
    ['coverPlate', 'Top cover plate', () => 1, g => box(g, W, 0.2, D, 0, 0, 0, MAT.cover)],
    ['tongue', 'Joint tongue', () => 4 * (M + 1), g => buildTongue(g, 0, 0, 1, 0)],
    ['foot', 'Base socket', () => 4, g => buildSocketCollar(g, cx, cz, 1, D)],
    ['screw', 'Fixing screw', () => points.filter(p => p.cat !== 'leg' && !p.noScrew && (!p.group.userData.acc || accOn[p.group.userData.acc])).length, g => screw(g, v3(0, 0, 0), 'y', -1)],
    ['bracket', 'L-bracket', () => (accOn.strip ? 2 : 0) + (accOn.server ? 2 * M : 0) + (accOn.switch ? 2 * M : 0), g => bracket(g, 1, 0, 0, 0)],
    ['hook', 'Cable hook', () => accOn.hook ? 8 * M : 0, g => buildHook(g, 1, 0, 0, 0)],
    ['strip', 'Power strip with tray', () => accOn.strip ? 1 : 0, g => buildStrip(g, 0, W, D)],
    ['inlet', 'Back power mount', () => accOn.inlet ? 1 : 0, g => buildInlet(g, 0, W, D)],
    ['server', 'Rack server', () => accOn.server ? M : 0, g => buildServer(g, 0, SERVER.w, SERVER.d, 0)],
    ['switch', 'Network switch', () => accOn.switch ? M : 0, g => buildSwitch(g, 0, SWITCH.w, SWITCH.d, 0)],
    ['monitor', 'Side monitor', () => accOn.monitor ? 1 : 0, g => buildMonitor(g, 1, 0, 0, b - LEG_D / 2, +$('monSize').value)],
  ];
  catItems = defs.map(([id, name, qty, make]) => {
    const wrap = new THREE.Group(), inner = new THREE.Group();
    wrap.add(inner);
    bare = id !== 'tongue' && id !== 'bracket' && id !== 'screw';
    make(inner);
    bare = false;
    const b3 = new THREE.Box3().setFromObject(inner), c = b3.getCenter(new THREE.Vector3()), size = b3.getSize(new THREE.Vector3());
    inner.position.set(-c.x, -b3.min.y, -c.z);    // centred, resting on its base
    catalog.add(wrap);
    const el = document.createElement('div');
    el.className = 'pt';
    el.style.background = '#1d2733';
    labelsEl.append(el);
    return { id, name, qty, wrap, size, el };
  });
  // Lay out in rows on the floor, in list order.
  let x = 0, z = 0, rowD = 0;
  const rowW = 80, gap = 6;
  for (const it of catItems) {
    const cell = Math.max(it.size.x, 14);   // room for the label on small parts
    if (x > 0 && x + cell > rowW) { x = 0; z += rowD + gap; rowD = 0; }
    it.wrap.position.set(x + cell / 2 - rowW / 2, grid.position.y, z + it.size.z / 2);
    x += cell + gap;
    rowD = Math.max(rowD, it.size.z);
  }
}
function catMode() { const v = $('focus').value; return v.startsWith('c:') ? v.slice(2) : null; }

function buildSocketCollar(g, cx, cz, sz, D) {
  // Base: same open-sided section as the top of a leg, on a floor plate.
  box(g, LEG_W, SPIGOT, T, cx, -SPIGOT / 2, sz * (D / 2 - LEG_D + T / 2), MAT.foot);
  for (const s of [-1, 1]) box(g, T, SPIGOT, LEG_D, cx + s * (LEG_W - T) / 2, -SPIGOT / 2, cz, MAT.foot);
  box(g, LEG_W + 1.5, 0.25, LEG_D + 1.5, cx, -SPIGOT - 0.125, cz, MAT.foot);
  cyl(g, 0.13, 0.5, v3(cx, -1, sz * (D / 2 - LEG_D + T / 2)), 'z', MAT.hole);
}

let plateT = 1.2 / 25.4;   // shelf sheet thickness, inches
function buildShelf(g, type, topY, W, D, what = 'both') {
  const a = W / 2, b = D / 2, ax = a - LEG_W, bz = b - LEG_D;
  const shape = new THREE.Shape();
  shape.moveTo(-ax, -b);
  [[ax, -b], [ax, -bz], [a, -bz], [a, bz], [ax, bz], [ax, b], [-ax, b], [-ax, bz], [-a, bz], [-a, -bz], [-ax, -bz]]
    .forEach(p => shape.lineTo(...p));
  shape.closePath();

  if (type === 'vent') {
    const R = 0.45, P = 1.5, M = 0.9;
    const inNotchZone = (x, y) => Math.abs(x) > ax - M && Math.abs(y) > bz - M;
    const nx = Math.floor((a - M - R) / P), ny = Math.floor((b - M - R) / P);
    const cableX = ax - 1.6, cableY = bz - 1.6;
    const inCable = (x, y) => Math.abs(Math.abs(x) - cableX) < 2.3 && Math.abs(Math.abs(y) - cableY) < 1.3;
    for (let i = -nx; i <= nx; i++) for (let j = -ny; j <= ny; j++) {
      const x = i * P, y = j * P;
      if (inNotchZone(x, y) || inCable(x, y)) continue;
      const h = new THREE.Path();
      h.absarc(x, y, R, 0, Math.PI * 2, true);
      shape.holes.push(h);
    }
    // Four larger rounded slots for cable pass-through.
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
      const h = new THREE.Path(), x = sx * cableX, y = sy * cableY, r = 0.7, l = 1.2;
      h.absarc(x + l, y, r, -Math.PI / 2, Math.PI / 2, false);
      h.absarc(x - l, y, r, Math.PI / 2, Math.PI * 1.5, false);
      h.closePath();
      shape.holes.push(h);
    }
  }
  const geo = new THREE.ExtrudeGeometry(shape, { depth: plateT, bevelEnabled: false, curveSegments: 12 });
  geo.rotateX(-Math.PI / 2);
  const plate = new THREE.Mesh(geo, MAT[type]);
  plate.position.y = topY - plateT;
  begin(g, `${shelfLabel} plate`, type === 'vent' ? 'plateVent' : 'plateSolid', `${type === 'vent' ? 'Vented' : 'Solid'} base plate of shelf ${shelfLabel}`);
  track(plate);
  if (what !== 'frame') g.add(plate);
  if (what === 'plate') return;

  begin(g, `${shelfLabel} frame`, 'frame', `Frame around shelf ${shelfLabel}, fixes to the legs`);
  // Frame around the plate. It follows the corner notches, so its faces meet the leg faces.
  const y = topY - SKIRT / 2;
  for (const s of [-1, 1]) {
    box(g, 2 * ax, SKIRT, T, 0, y, s * (b - T / 2), MAT.frame);
    box(g, T, SKIRT, 2 * bz, s * (a - T / 2), y, 0, MAT.frame);
  }
  for (const [, sx, sz] of CORNERS) {
    box(g, T, SKIRT, LEG_D, sx * (ax - T / 2), y, sz * (bz + LEG_D / 2), MAT.frame);
    box(g, LEG_W, SKIRT, T, sx * (ax + LEG_W / 2), y, sz * (bz - T / 2), MAT.frame);
  }
}

function build() {
  if (root) {
    root.traverse(o => { if (o.geometry && !Object.values(screwGeo).includes(o.geometry)) o.geometry.dispose(); if (o.isMesh && o.material.depthTest === false) o.material.dispose(); });
    scene.remove(root);
  }
  labelsEl.textContent = '';
  root = new THREE.Group();
  scene.add(root);
  labelsEl.append(mLabelEl);
  mLabelEl.style.display = 'none';
  parts = []; points = []; items = []; hot = null; cur = null; collecting = true;

  const clamp = (el, lo, hi) => { const v = Math.max(lo, Math.min(hi, +el.value || lo)); el.value = v; return v; };
  const M = clamp($('modules'), 1, 4), W = clamp($('width'), 14, 48), D = clamp($('depth'), 10, 48);
  plateT = +$('plateThk').value / 25.4;
  const nShelf = +$('shelves').value, pattern = $('pattern').value;

  for (const [c, sx, sz] of CORNERS) {

    for (let m = 0; m < M; m++) {

      if (c === 'FL' && m === 0) leg.userData.first = true;

      });

      addPoint(leg, `L${m + 1}-${c}-T`, `Leg ${m + 1} socket (top end)`, 'leg', v3(cx, baseY + LEG_H - 1, cz));
      const up = v3(cx, baseY + 1, backZ);
      screw(leg, up, 'z', sz);
      addPoint(leg, `T${m + 1}-${c}`, `Joint tongue to bottom of leg L${m + 1}-${c}`, 'joint', up);
      if (m > 0) {
        const p = v3(cx, baseY - 1, backZ);
        screw(leg, p, 'z', sz);
        addPoint(leg, `J${m}-${c}`, `Leg L${m}-${c} socket to leg L${m + 1}-${c} spigot`, 'joint', p);

    const cov = v3(cx, H - 1, backZ);

    points.coverScrews.push({ c, cx, cz, sz, cov });
  }

  // Shelves
  for (let m = 0; m < M; m++) SHELF_HOLE[nShelf].forEach((hole, n) => {
    const type = pattern === 'alt' ? (shelfIndex % 2 ? 'vent' : 'solid') : pattern;
    shelfIndex++;
    counts[type]++;
    const y = m * LEG_H + hole;
    const g = addPart(type, v3(0, m * 12 + 3 + n * 4, 0));
    if (counts[type] === 1) g.userData.first = true;
    shelfLabel = `S${m + 1}.${n + 1}`;
    buildShelf(g, type, y + SKIRT / 2, W, D);
    const id = `S${m + 1}.${n + 1}`;
    shelves.push({ id, m, n, last: n === serverShelf(nShelf), top: y + SKIRT / 2, explode: g.userData.explode });
    for (const [c, sx, sz] of CORNERS) {
      const pa = v3(sx * (ax - T), y, sz * (bz + LEG_D / 2));
      const pb = v3(sx * (ax + LEG_W / 2), y, sz * (bz - T));
      screw(g, pa, 'x', sx);

  });

  // Top cover: a plain rectangle with plugs that drop into each leg top.

  cover.userData.first = true;
  begin(cover, 'Top cover plate', 'cover', 'Rectangular plate on top of the legs');
  box(cover, W, 0.2, D, 0, H + 0.1, 0, MAT.cover);
  for (const { c, cx, cz, sz, cov } of points.coverScrews) {
    begin(cover, `C-${c}`, 'cover', '');
    items.pop();
    buildTongue(cover, cx, cz, sz, H - 2);
    screw(cover, cov, 'z', sz);
    addPoint(cover, `C-${c}`, `Top cover plug to leg L${M}-${c} socket`, 'cover', cov);
  }
  delete points.coverScrews;

  // Power strip mount on the chosen shelf.
  const sel = $('stripShelf'), keep = sel.value;
  sel.innerHTML = shelves.map(s => `<option>${s.id}</option>`).join('');
  sel.value = shelves.some(s => s.id === keep) ? keep : shelves[0].id;
  const host = shelves.find(s => s.id === sel.value);
  const strip = addPart('strip', host.explode.clone().add(v3(0, 2.5, 0)), 'strip');
  strip.userData.first = true;
  begin(strip, 'Power strip with tray', 'strip', `Mounted on shelf ${host.id}`);
  const st = buildStrip(strip, host.top, W, D);
  for (const s of [-1, 1]) addPoint(strip, `P-S${s < 0 ? 'L' : 'R'}`, `Power strip clamp to shelf ${host.id}`, 'power', v3(s * st.clampX, host.top + 0.28, st.zc));

  // One server per leg module, on that module's top shelf. It keeps clear of the
  // strip's tray when they share a shelf, and of the legs at the sides.
  let minDepth = Infinity, minW = Infinity;
  const devs = [];
  for (const sh of shelves.filter(x => x.last)) {
    const zMax = bz - 0.3, zMin = sh === host ? -(b - 4.2) : -(bz - 0.3);
    const depth = Math.min(SERVER.d, zMax - zMin), zc = zMax - depth / 2, w = Math.min(SERVER.w, W - 2.2);
    minDepth = Math.min(minDepth, depth); minW = Math.min(minW, w);
    const g = addPart('server', sh.explode.clone().add(v3(0, 6, 0)), 'server');
    if (sh.m === 0) g.userData.first = true;
    begin(g, `Server ${sh.m + 1}`, 'server', `On shelf ${sh.id}`);
    buildServer(g, sh.top, w, depth, zc);
    devs.push({ name: `Server ${sh.m + 1}`, acc: 'server', x: w / 2 - 1.5, y: sh.top + 1, z: zc - depth / 2 - 0.1, cross: sh.top + 0.6 });
    for (const [c, s] of [['L', -1], ['R', 1]])
      addPoint(g, `V${sh.m + 1}-${c}`, `Server ${sh.m + 1} bracket to shelf ${sh.id}`, 'server', v3(s * (w / 2 + 0.5), sh.top + 0.3, zc));
  }

  // One switch per leg module: on the shelf below the server, or hung under the
  // shelf when the module has only one, so it never depends on the server being fitted.
  for (let m = 0; m < M; m++) {
    const own = shelves.filter(x => x.m === m);
    const sh = own[Math.max(0, serverShelf(own.length) - 1)], hang = own.length === 1;
    const zMax = bz - 0.3, zMin = !hang && sh === host ? -(b - 4.2) : -(bz - 0.3);
    const depth = Math.min(SWITCH.d, zMax - zMin), zc = zMax - depth / 2, w = Math.min(SWITCH.w, W - 2.2);
    const under = sh.top - T - 0.02;
    const base = hang ? under - SWITCH.h - 0.1 : sh.top + 0.1;
    const g = addPart('switch', sh.explode.clone().add(v3(0, hang ? -5 : 3, 4)), 'switch');
    if (m === 0) g.userData.first = true;
    begin(g, `Switch ${m + 1}`, 'switch', `At shelf ${sh.id}`);
    buildSwitch(g, base, w, depth, zc, hang ? under : undefined);
    devs.push({ name: `Switch ${m + 1}`, acc: 'switch', x: w / 2 - 3.5, y: base + SWITCH.h / 2, z: zc - depth / 2, cross: hang ? sh.top - 1.8 : sh.top + 0.6 });
    for (const [c, s] of [['L', -1], ['R', 1]])
      addPoint(g, `W${m + 1}-${c}`, `Switch ${m + 1} bracket to shelf ${sh.id}`, 'switch', v3(s * (w / 2 + 0.5), hang ? under - 0.2 : base + 0.2, zc));
  }

  // Side monitor at about standing eye level, on a hole row free of hooks and strips.
  const monSide = +$('monSide').value, monSize = +$('monSize').value;
  const monY = M > 1 ? LEG_H + 13 : 13, monZ = b - LEG_D / 2;
  const mon = addPart('monitor', v3(monSide * 16, 8, 0), 'monitor');
  mon.userData.first = true;
  begin(mon, 'Side monitor', 'monitor', `${monSize} in, on the ${monSide > 0 ? 'right' : 'left'} side`);
  buildMonitor(mon, monSide, a, monY, monZ, monSize);
  const monLeg = monSide > 0 ? 'R' : 'L', monMod = M > 1 ? 2 : 1;
  for (const [c, s] of [['F', 1], ['B', -1]])
    addPoint(mon, `D-${c}${monLeg}`, `Monitor rail to outer 2 in face of leg L${monMod}-${c}${monLeg}`, 'monitor', v3(monSide * (a + 0.3), monY, s * monZ));
  devs.push({ name: 'Side monitor', acc: 'monitor', x: monSide * (a + 0.6), y: monY - 0.6, z: 0, cross: monY - 0.6 });

  if (LOADOUT) {

    const pcb = std('#2d6e43', 0, 0.6), z0 = bz - 0.3;
    const LIST = [
      [0, 0, 'Proxmox host', 'Hypervisor, runs the proxmox-ubuntu-10 VM', 'server'],
      [0, 1, 'sdc backup drive', '1 TB drive attached to the Proxmox host', 'drive'],
      [0, 2, 'networkeye', 'Raspberry Pi, monitoring', 'pi'],
      [0, 3, 'reception', 'Raspberry Pi, Pi-hole DNS', 'pi'],
      [1, 0, 'ER605', 'Omada multi-WAN gateway', 'gateway'],
      [1, 1, 'Airtel-Ashutosh', 'Airtel PON router', 'router'],
      [1, 2, 'Excitel', 'Excitel PON router', 'router'],
    ];
    for (const [m, n, name, desc, kind] of LIST) {
      const sh = shelves.find(x => x.m === m && x.n === n);
      if (!sh) continue;
      const g = addPart('server', sh.explode.clone().add(v3(0, 5, 0)), 'loadout');
      begin(g, name, 'server', `${desc}, on shelf ${sh.id}`);
      let dw = 9, dh = 1.5, dd = 6;
      if (kind === 'server') {
        dw = Math.min(SERVER.w, W - 2.2); dh = SERVER.h; dd = Math.min(SERVER.d, z0 + (sh === host ? b - 4.2 : bz - 0.3));
        buildServer(g, sh.top, dw, dd, z0 - dd / 2);
      } else if (kind === 'pi') {
        dw = 3.5; dh = 1.2; dd = 2.5;
        box(g, dw, 0.15, dd, 0, sh.top + 0.4, z0 - dd / 2, pcb);
        box(g, 1, 0.6, 1, 0, sh.top + 0.8, z0 - dd / 2, MAT.silverDark);
      } else if (kind === 'drive') {
        dw = 3.2; dh = 1; dd = 5;
        box(g, dw, dh, dd, 0, sh.top + 0.1 + dh / 2, z0 - dd / 2, MAT.bay);
      } else {
        box(g, dw, dh, dd, 0, sh.top + 0.1 + dh / 2, z0 - dd / 2, MAT.bay);
        if (kind === 'router') for (const sx of [-1, 1]) box(g, 0.14, 3, 0.14, sx * (dw / 2 - 0.6), sh.top + dh + 1.6, z0 - dd + 0.3, MAT.bay);
      }
      if (kind !== 'server') box(g, 0.14, 0.14, 0.04, dw / 2 - 0.5, sh.top + 0.1 + dh / 2, z0 + 0.01, MAT.led);
      addPoint(g, name, desc, 'server', v3(-dw / 2, sh.top + dh + 0.3, z0));
      devs.push({ name, acc: 'loadout', x: dw / 2 - 0.5, y: sh.top + 0.6, z: z0 - dd - 0.1, cross: sh.top + 0.6 });
    }
  }

  cur = null;

  // Power cords: device rear, over the shelf's back edge, down the open channel of
  // the back-right leg, then across to its own socket on the strip.
  const clearY = y => {
    const local = ((y % LEG_H) + LEG_H) % LEG_H;
    const hit = STRIP_Y.find(c => Math.abs(local - c) < STRIP_H / 2 + 0.2);
    return hit === undefined ? y : y + (hit + STRIP_H / 2 + 0.3 - local);
  };
  const chan = -(b - LEG_D / 2), legX = a - LEG_W / 2, sockY = host.top + 2.75;
  const tieYs = [];
  devs.slice(0, st.sockets.length).forEach((d, i) => {
    const sx = st.sockets[i], o = (i - 2.5) * 0.3, inY = clearY(d.cross), outY = clearY(sockY);
    const lane = -(b + 0.75 + i * 0.14);     // each cord keeps its own lane behind the rack
    tieYs.push(inY, outY);
    const c = cableRoute([
      v3(d.x, d.y, d.z), v3(d.x, d.cross, d.z), v3(d.x, d.cross, lane), v3(legX + o, d.cross, lane), v3(legX + o, inY, lane),
      v3(legX + o, inY, chan), v3(legX + o, outY, chan), v3(legX + o, outY, lane),
      v3(sx, outY, lane), v3(sx, sockY, lane), v3(sx, sockY, st.zc), v3(sx, host.top + 1.5, st.zc),
    ]);
    const m = new THREE.Mesh(new THREE.TubeGeometry(c, 220, 0.07, 6), MAT.cord[d.acc]);
    root.add(m);
    box(m, 0.7, 0.5, 0.9, sx, host.top + 1.65, st.zc, MAT.cable);    // plug
    cords.push({ mesh: m, acc: d.acc });
    addPoint(strip, `P-O${i + 1}`, `Socket ${i + 1}: ${d.name} power cord`, 'power', v3(sx, host.top + 2, st.zc));
    points[points.length - 1].noScrew = true;
  });
  // Cable ties around the bundle inside the leg channel, clear of the leg's strips.
  if (tieYs.length) {
    const ties = new THREE.Group(), lo = Math.min(...tieYs), hi = Math.max(...tieYs);
    for (let y = lo + 1; y < hi; y += 6) {
      const ty = clearY(y);
      const tie = new THREE.Mesh(new THREE.TorusGeometry(1, 0.05, 6, 28), MAT.cable);
      tie.rotation.x = Math.PI / 2;
      tie.scale.set(1.05, 0.45, 1);
      tie.position.set(legX, ty, chan);
      ties.add(tie);
    }
    root.add(ties);
    cords.push({ mesh: ties, acc: 'strip' });
  }
  const spare = st.sockets.length - devs.length;
  $('powerNote').textContent = spare >= 0
    ? `Power: ${devs.length} of ${st.sockets.length} strip sockets used.`
    : `Power: only ${st.sockets.length} strip sockets, so ${-spare} devices have no cord. Add a second strip.`;

  const cut = [];
  if (minW < SERVER.w) cut.push(`width to ${minW.toFixed(1)} in`);
  if (minDepth < SERVER.d) cut.push(`depth to ${minDepth.toFixed(1)} in`);
  $('serverNote').textContent = `Real size: ${SERVER.w} W x ${SERVER.h} H x ${SERVER.d} D in.` +
    (cut.length ? ` Shortened to fit this rack: ${cut.join(', ')}.` : ' Fits at full size.');

  // Power entry on the back, in a hole row no shelf layout uses.
  const inletY = 5;
  const inlet = addPart('inlet', v3(0, 0, -9), 'inlet');
  inlet.userData.first = true;
  begin(inlet, 'Back power mount', 'inlet', 'Panel across the two back legs');
  const iw = buildInlet(inlet, inletY, W, D);
  for (const [c, s] of [['L', -1], ['R', 1]]) {
    const p = v3(s * (ax - T), inletY, -(b - LEG_D / 2));
    thumb(inlet, p, 'x', s);
    addPoint(inlet, `P-B${c}`, `Back power mount to 2 in face of leg L1-B${c}`, 'power', p);
  }

  // Power lead: from the strip, over the back edge of the shelf, into the back mount.
  const path = cableRoute([
    v3(st.cableX, host.top + 0.9, st.zc - 1), v3(st.cableX, host.top + 0.9, -(b + 0.3)),
    v3(st.cableX, inletY, -(b + 0.3)), v3(iw / 2, inletY, -(b + 0.3)),
  ]);
  cable = new THREE.Mesh(new THREE.TubeGeometry(path, 90, 0.12, 8), MAT.cable);
  root.add(cable);

  if (grid) scene.remove(grid);
  grid = new THREE.GridHelper(120, 20, '#aab4bd', '#ccd3da');
  grid.position.y = -SPIGOT - 0.26;
  scene.add(grid);

  collecting = false;
  cur = null;
  buildCatalog(W, D, M);

  const totalH = H + 0.2 + SPIGOT + 0.25;
  $('size').textContent = `${W} W x ${D} D x ${totalH.toFixed(1)} H in (${(W * 2.54).toFixed(0)} x ${(D * 2.54).toFixed(0)} x ${(totalH * 2.54).toFixed(0)} cm)`;
  $('list').innerHTML = '';
  listGroups = [];
  const singleOpen = { leg: true };
  for (const [kind, title] of Object.entries(ITEM_KINDS)) {
    const list = items.filter(it => it.kind === kind);

}

for (const [k, c] of Object.entries(CATS)) {
  const l = document.createElement('label');
  l.className = 'cat';
  l.innerHTML = `<input type="checkbox" ${catOn[k] ? 'checked' : ''}><span class="sw" style="background:${c.color}"></span>${c.name}`;
  l.firstChild.onchange = e => { catOn[k] = e.target.checked; applyVisibility(); };
  $('cats').append(l);
}
$('material').onchange = () => {
  if ($('material').value !== 'custom') $('density').value = $('material').value;
  renderBom();
};
$('density').oninput = () => {
  const match = [...$('material').options].find(o => o.value === $('density').value);
  $('material').value = match ? match.value : 'custom';
  renderBom();
};
['modules', 'shelves', 'pattern', 'width', 'depth', 'stripShelf', 'monSize', 'monSide', 'plateThk'].forEach(id => $(id).onchange = build);
const accBoxes = [...document.querySelectorAll('[data-acc]')];
const accessoryBoxes = () => accBoxes.filter(b => true);
function accChanged() {
  const on = accessoryBoxes().filter(b => b.checked).length, all = accessoryBoxes().length;
  $('accAll').checked = on === 0;
  $('accAll').indeterminate = on > 0 && on < all;
  renderBom();
  applyVisibility();
}
accBoxes.forEach(b => b.onchange = () => { accOn[b.dataset.acc] = b.checked; accChanged(); });
$('accAll').onchange = e => {
  accessoryBoxes().forEach(b => { b.checked = !e.target.checked; accOn[b.dataset.acc] = b.checked; });
  accChanged();
};
$('focus').onchange = () => { selectItem(null); applyVisibility(); applyExplode(); frame('iso'); };
$('explode').oninput = applyExplode;
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => frame(b.dataset.v));
addEventListener('resize', () => { resize(); if (LOADOUT) frame('iso'); });
resize();
build();
loop();
</script>
</body>
</html>
